<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洛克王國 · 異色孵蛋</title>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <style>
    /* ===== 全域樣式 ===== */
    @font-face {
      font-family: 'MIANFEIZITI';
      src: url('fonts/MIANFEIZITI.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      font-family: 'Huninn', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    h1, h2 {
      font-family: 'MIANFEIZITI', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    body {
      background-image: url('https://game.gtimg.cn/images/rocom/act/a20260706preview/web/part1/20260706/bg.avif');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-color: #ffffff;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .container {
      background: rgba(232, 225, 209, 0.9);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #2a2a2a;
      font-family: 'MIANFEIZITI', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      font-weight: 400;
      font-size: 2.8rem;
      text-align: center;
      border-left: none;
      padding-left: 0;
      margin-top: 0;
      margin-bottom: 4px;
      width: 100%;
    }

    h2 {
      color: #4a5568;
      font-family: 'MIANFEIZITI', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      font-weight: 400;
      font-size: 1.3rem;
      margin: 30px 0 16px 0;
      border-bottom: 4px solid #bab4a7;
      padding-bottom: 8px;
    }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 150px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
    }

    .form-group input,
    .form-group select {
      padding: 10px 14px;
      border: 2px solid #bab4a7;
      border-radius: 12px;
      font-size: 1rem;
      background: #f3ede0;
      transition: 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #6c5ce7;
      outline: none;
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
      background: #faf9ff;
    }

    .btn {
      padding: 10px 28px;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      background: #e2e8f0;
      color: #2d3748;
    }
    .btn:hover {
      transform: scale(1.02);
    }
    .btn-primary:hover {
      background: #5a4bd1;
      transform: scale(1.02);
    }
    .btn-danger:hover {
      background: #f56565;
      transform: scale(1.02);
    }
    #btnExport,
    #btnImport {
      background: #f3ede0 !important;
      color: #2d3748 !important;
    }
    #btnExport:hover,
    #btnImport:hover {
      background: #e8e1d1 !important;
      transform: scale(1.02) !important;
    }
    #btnRefresh {
      background: #f3ede0 !important;
      color: #2d3748 !important;
    }
    #btnRefresh:hover {
      background: #e8e1d1 !important;
      transform: scale(1.02) !important;
    }
    #btnClear {
      background: #fc8181 !important;
      color: white !important;
    }
    #btnClear:hover {
      background: #f56565 !important;
      transform: scale(1.02) !important;
    }

    .btn-primary {
      background: #f3ede0;
      color: #2d3748;
      border: none;
    }

    .btn-primary:hover {
      background: #e8e1d1;
      transform: scale(1.02);
    }

    .btn-danger {
      background: #fc8181;
      color: white;
      padding: 4px 14px;
      font-size: 0.85rem;
    }

    .btn-danger:hover {
      background: #f56565;
    }

    .btn-sm {
      padding: 6px 18px;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* ===== 自訂確認對話框 ===== */
    .custom-confirm-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .custom-confirm-box {
      background: white;
      border-radius: 20px;
      padding: 24px;
      max-width: 340px;
      width: 85%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .custom-confirm-box p {
      font-size: 1rem;
      color: #2d3748;
      margin: 0 0 20px 0;
      line-height: 1.6;
      white-space: pre-line;
    }

    .custom-confirm-box .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .custom-confirm-box .btn-group .btn {
      flex: 1;
      padding: 10px 20px;
      border-radius: 40px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .custom-confirm-box .btn-cancel {
      background: #e2e8f0;
      color: #2d3748;
    }

    .custom-confirm-box .btn-confirm {
      background: #fc8181;
      color: white;
    }

    .custom-confirm-box .btn-confirm:hover {
      background: #f56565;
    }

    /* ===== 系別圖示 ===== */
    .type-icon {
      width: 22px;
      height: 22px;
      display: inline-block;
      margin: 0;
      vertical-align: middle;
      border-radius: 4px;
    }

    .type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.65rem;
      font-weight: 700;
      color: white;
      margin: 0 2px;
      min-width: 20px;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* ===== 表格 ===== */
    .table-wrap {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th {
      background: #e8e1d1;
      color: #2d3748;
      padding: 12px 12px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #bab4a7;
    }

    .empty-row td {
      text-align: center;
      color: #a0aec0;
      padding: 30px 0;
      font-style: italic;
    }

    /* ===== 表格容器（可滾動） ===== */
    .table-scroll {
      max-height: 400px;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #bab4a7;
      background: #f3ede0;
      padding-right: 4px; /* 為滾動條留出空間，避免擋住邊框 */
    }
    /* 滾動條樣式 - 適用於 WebKit 瀏覽器（Chrome、Safari、Edge） */
    .table-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .table-scroll::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 3px;
    }
    .table-scroll::-webkit-scrollbar-thumb {
      background: rgba(186, 180, 167, 0.5);
      border-radius: 3px;
      border: 1px solid #f3ede0;
    }
    .table-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(186, 180, 167, 0.8);
    }
    /* 滾動條樣式 - 適用於 Firefox */
    .table-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(186, 180, 167, 0.5) transparent;
    }

    .table-scroll table {
      border-collapse: collapse;
      width: 100%;
      background: #f3ede0;
    }

    .table-scroll thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .table-scroll thead th {
      background: #e8e1d1;
      border-bottom: 2px solid #bab4a7;
    }

    .table-scroll td:last-child {
      white-space: nowrap;
      min-width: 140px;
      text-align: left;
    }

    .table-scroll .btn-table {
      display: inline-block !important;
      width: auto !important;
      padding: 6px 14px;
      font-size: 0.85rem;
      white-space: nowrap;
      margin: 0 2px;
    }

    /* ===== 推薦卡片 ===== */
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .rec-card {
      background: #f7fafc;
      border-radius: 16px;
      padding: 16px 20px;
      border: 2px solid #e2e8f0;
      transition: 0.2s;
    }

    .rec-card:hover {
      border-color: #6c5ce7;
      background: #faf9ff;
    }

    .rec-card .title {
      font-weight: 700;
      color: #2d3748;
      font-size: 1.1rem;
    }

    .rec-card .detail {
      display: block;
      font-size: 0.9rem;
      color: #4a5568;
      margin-top: 6px;
    }

    .rec-card .badge {
      display: inline-block;
      background: #6c5ce7;
      color: white;
      padding: 0 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 8px;
    }

    /* ===== 窩位擺放 ===== */
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 8px;
    }

    .slot-pair {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #f7fafc;
      border-radius: 12px;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      min-height: 100px;
      transition: 0.2s;
    }

    .slot-pair.has-recommendation {
      border-color: #6c5ce7;
      background: #faf9ff;
    }

    .slot-pair .slot-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #a0aec0;
      text-align: center;
      letter-spacing: 1px;
    }

    .slot-pair .slot-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 0.85rem;
      gap: 2px;
    }
    .slot-pair .slot-content > span,
    .slot-pair .slot-content .dad,
    .slot-pair .slot-content .mom {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }
    .slot-pair .slot-content > span > span,
    .slot-pair .slot-content .dad > span,
    .slot-pair .slot-content .mom > span {
      justify-content: center;
      text-align: center;
    }
    .slot-pair .slot-content .dad,
    .slot-pair .slot-content .mom {
      width: 100%;
      justify-content: center;
    }

    .slot-pair .slot-content .dad {
      color: #6c5ce7;
      font-weight: 700;
    }

    .slot-pair .slot-content .mom {
      color: #38a169;
      font-weight: 700;
    }

    .slot-pair .slot-content .arrow {
      color: #a0aec0;
      font-size: 1.2rem;
    }

    .slot-pair .slot-content .empty-text {
      color: #a0aec0;
      font-size: 0.9rem;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .slot-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 480px) {
      .slot-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ===== RWD 響應式 ===== */
    @media (max-width: 640px) {
      body {
        padding: 4px;
      }
      .container {
        padding: 16px 12px;
        border-radius: 16px;
      }
      .flex-row {
        flex-direction: row !important;
        flex-wrap: wrap !important;
        gap: 8px;
      }
      .form-group {
        flex: 1 1 100% !important;
        width: 100% !important;
      }

      /* 賽季篩選和系別篩選並排 */
      .form-group:has(select#seasonFilter),
      .form-group:has(select#typeFilter) {
        flex: 1 1 45% !important;
        width: 45% !important;
        min-width: 0 !important;
      }
      .form-group input,
      .form-group select {
        width: 100%;
      }
      .form-group select#seasonFilter {
        width: 100%;
        font-size: 0.85rem;
      }
      .form-group select#typeFilter {
        width: 100%;
        font-size: 0.85rem;
      }
      .btn {
        width: 100%;
      }
      .rec-grid {
        grid-template-columns: 1fr;
      }

      /* 卡片和窩位手機端縮小 */
      .rec-card {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
      }
      .rec-card .detail {
        display: block !important;
        overflow-x: visible !important;
        -webkit-overflow-scrolling: touch;
      }

      /* ===== 強制窩位 grid 兩欄 ===== */
      .slot-grid {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px !important;
      }
      .slot-grid .slot-pair {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        overflow: hidden !important;
        word-break: break-word !important;
        box-sizing: border-box !important;
      }
      /* 限制窩位內容的寬度，避免溢出 */
      .slot-grid .slot-pair .slot-content {
        width: 100% !important;
        overflow: hidden !important;
        word-break: break-word !important;
        gap: 2px !important;
        padding: 2px 0 !important;
      }
      /* 強制所有文字換行 */
      .slot-grid .slot-pair .slot-content span,
      .slot-grid .slot-pair .slot-content div {
        max-width: 100% !important;
        white-space: normal !important;
        word-break: break-word !important;
      }

      /* 表格與其他按鈕調整（你原有的） */
      .form-group select#typeFilter {
        width: 100%;
        font-size: 0.85rem;
      }
      .form-group select#seasonFilter {
        font-size: 0.85rem;
      }
      .table-scroll th {
        white-space: nowrap;
        font-size: 0.75rem;
        padding: 6px 4px;
      }
      .table-scroll td {
        font-size: 0.75rem;
        padding: 6px 4px;
      }
      .table-scroll td:last-child {
        white-space: nowrap;
        width: 1%;
        min-width: 110px;
        text-align: left;
      }
      .table-scroll .btn-table {
        display: inline-block !important;
        width: auto !important;
        padding: 4px 10px !important;
        font-size: 0.7rem !important;
        white-space: nowrap;
        margin: 0 2px;
        flex: none !important;
      }
      #prioritySeason {
        flex: 0 1 auto !important;
        min-width: 60px !important;
        max-width: 90px !important;
        font-size: 0.7rem !important;
        padding: 2px 4px !important;
      }
      #btnApplyPriority {
        flex: none !important;
        padding: 2px 8px !important;
        font-size: 0.7rem !important;
        width: auto !important;
      }
      #btnManageExcludeInline,
      #btnManageWishlistInline {
        flex: none !important;
        padding: 2px 8px !important;
        font-size: 0.7rem !important;
        width: auto !important;
      }
      #btnRefresh {
        padding: 6px 18px !important;
        font-size: 0.9rem !important;
        height: 40px !important;
        line-height: 1.4 !important;
        width: auto !important;
        margin-top: 12px !important;
        flex: 0 1 auto !important;
        border-radius: 40px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      /* 手機版：匯出匯入按鈕同一行，高度一致 */
      #btnExport,
      #btnImport {
        flex: 1 !important;
        min-width: 80px !important;
        padding: 6px 12px !important;
        font-size: 0.85rem !important;
        height: 40px !important;
        line-height: 1.4 !important;
        width: auto !important;
        border-radius: 40px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      #btnClear {
        height: 40px !important;
        line-height: 1.4 !important;
        padding: 6px 12px !important;
        font-size: 0.85rem !important;
        border-radius: 40px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      /* 備註文字在手機上可換行 */
      .rec-card .detail > div:last-child {
        white-space: normal !important;
        word-break: break-word !important;
        font-size: 0.7rem !important;
        color: #718096 !important;
        margin-top: 4px !important;
      }
      .rec-card .detail>div:first-child span {
        font-size: 0.85rem !important;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .rec-card .detail>div:first-child select {
        flex: 0 1 auto !important;
        min-width: 60px !important;
        max-width: 90px !important;
        font-size: 0.85rem !important;
        padding: 2px 4px !important;
      }
      .rec-card .detail>div:first-child button {
        flex: 0 0 auto !important;
        padding: 2px 8px !important;
        font-size: 0.85rem !important;
        white-space: nowrap;
      }
      .rec-card .detail>div:nth-child(2),
      .rec-card .detail>div:nth-child(3) {
        display: flex !important;
        flex-wrap: nowrap !important;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        gap: 3px !important;
        padding: 2px 0 !important;
      }
      /* 只選中「排除清單：」「願望清單：」標籤，不影響精靈名稱 */
      .rec-card .detail>div:nth-child(2) > span:first-child,
      .rec-card .detail>div:nth-child(3) > span:first-child {
        font-size: 0.85rem !important;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .rec-card .detail>div:nth-child(2) button,
      .rec-card .detail>div:nth-child(3) button {
        flex: 0 0 auto !important;
        padding: 2px 8px !important;
        font-size: 0.85rem !important;
        white-space: nowrap;
      }
      /* 窩位卡片內的排除/願望精靈名稱在手機上保持 0.7rem */
      #excludeTagsInline span,
      #wishlistTagsInline span {
        font-size: 0.7rem !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1>異色孵蛋智能配種</h1>
    </div>

    <!-- ===== 輸入區域 ===== -->
    <div class="flex-row">
      <div class="form-group" style="flex: 1;">
        <label>精靈名稱</label>
        <input type="text" id="inputName" placeholder="例如：雪影娃娃" list="nameSuggest" style="height: 46px;">
        <datalist id="nameSuggest"></datalist>
      </div>

      <div class="form-group" style="flex: 0 0 auto; min-width: 120px;">
        <label>賽季篩選</label>
        <select id="seasonFilter" style="height: 46px;">
          <option value="all">全部</option>
          <option value="S1常駐">S1常駐</option>
          <option value="S1賽季">S1賽季</option>
          <option value="S2常駐">S2常駐</option>
          <option value="S2賽季">S2賽季</option>
          <option value="S3常駐">S3常駐</option>
          <option value="S3賽季">S3賽季</option>
          <option value="S4常駐">S4常駐</option>
          <option value="S4賽季">S4賽季</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="form-group" style="flex: 0 0 auto; min-width: 100px;">
        <label>系別篩選</label>
        <select id="typeFilter" style="height: 46px;">
          <option value="all">全部</option>
          <option value="普通" style="color:#3f89b4;">⬤ 普通</option>
          <option value="草" style="color:#4ebc73;">⬤ 草</option>
          <option value="火" style="color:#db5525;">⬤ 火</option>
          <option value="水" style="color:#6aa9fe;">⬤ 水</option>
          <option value="光" style="color:#4fc0ff;">⬤ 光</option>
          <option value="地" style="color:#9a7e3f;">⬤ 地</option>
          <option value="冰" style="color:#5faddd;">⬤ 冰</option>
          <option value="龍" style="color:#fc7cac;">⬤ 龍</option>
          <option value="電" style="color:#e7c506;">⬤ 電</option>
          <option value="毒" style="color:#ba62e0;">⬤ 毒</option>
          <option value="蟲" style="color:#9ece21;">⬤ 蟲</option>
          <option value="武" style="color:#ff9636;">⬤ 武</option>
          <option value="翼" style="color:#3ec7ca;">⬤ 翼</option>
          <option value="萌" style="color:#fc7cac;">⬤ 萌</option>
          <option value="幽" style="color:#9446ec;">⬤ 幽</option>
          <option value="惡" style="color:#cf467a;">⬤ 惡</option>
          <option value="機械" style="color:#40cba9;">⬤ 機械</option>
          <option value="幻" style="color:#9fa7f8;">⬤ 幻</option>
        </select>
      </div>

      <div class="form-group" style="flex: 1;">

    // ---------- 儲存操作 ----------
    function loadRecords() {
      try {
        var data = localStorage.getItem('shinyRecords');
        return data ? JSON.parse(data) : [];
      } catch (e) { return []; }
    }

    function saveRecords(records) {
      localStorage.setItem('shinyRecords', JSON.stringify(records));
    }

    // ---------- 輔助函式 ----------
    function findRocoByName(inputName) {
      if (ROCO_DB[inputName]) {
        return { name: inputName, data: ROCO_DB[inputName] };
      }
      return null;
    }

    function findEvoBase(name) {
      var data = ROCO_DB[name];
      if (data && !data.evolvesFrom) {
        return { name: name, data: data };
      }
      if (data && data.evolvesFrom) {
        return findEvoBase(data.evolvesFrom);
      }
      return null;
    }

    function getEvolutionChain(baseName) {
      var chain = [baseName];
      var current = baseName;
      var found = true;
      while (found) {
        found = false;
        for (var name in ROCO_DB) {
          if (ROCO_DB.hasOwnProperty(name)) {
            var data = ROCO_DB[name];
            if (data.evolvesFrom === current && chain.indexOf(name) === -1) {
              chain.push(name);
              current = name;
              found = true;
              break;
            }
          }
        }
      }
      return chain;
    }

    function isEvoBase(name) {
      var data = ROCO_DB[name];
      if (data && data.evolvesFrom) return false;
      return true;
    }

    function getEvoBaseName(name) {
      var base = findEvoBase(name);
      return base ? base.name : name;
    }

    function renderTypeIcons(types) {
      if (!types || types.length === 0) return '';
      return types.map(function(type) {
        var icon = TYPE_ICONS[type];
        var color = TYPE_COLORS[type] || '#999';
        if (icon) {
          return '<img src="' + icon + '" alt="' + type + '" class="type-icon" title="' + type + '" style="width:22px;height:22px;display:inline-block;margin:0 -2px;vertical-align:middle;">';
        } else {
          return '<span class="type-badge" style="background:' + color + ';">' + type + '</span>';
        }
      }).join('');
    }

    function getRocosByEggGroup(group) {
      var result = [];
      for (var name in ROCO_DB) {
        if (ROCO_DB.hasOwnProperty(name)) {
          var data = ROCO_DB[name];
          if (data.eggGroups.indexOf(group) !== -1) {
            result.push({ name: name, season: data.season });
          }
        }
      }
      result.sort(function(a, b) {
        return (SEASON_PRIORITY[a.season] || 999) - (SEASON_PRIORITY[b.season] || 999);
      });
      return result;
    }

    function getRecordedNames(records) {
      var set = {};
      records.forEach(function(r) { set[r.name] = true; });
      return Object.keys(set);
    }

    function getRecordedGroups(records) {
      var set = {};
      records.forEach(function(r) {
        if (Array.isArray(r.eggGroups)) {
          r.eggGroups.forEach(function(g) { set[g] = true; });
        } else {
          set[r.eggGroup] = true;
        }
      });
      return Object.keys(set);
    }

    function getEggGroupsForRoco(name) {
      var data = ROCO_DB[name];
      return data ? data.eggGroups : [];
    }

    function getSeasonForRoco(name) {
      var data = ROCO_DB[name];
      return data ? data.season : null;
    }

    function getMaleShinies(records) {
      return records.filter(function(r) { return r.gender === '公'; });

      var container = document.getElementById('excludeChecklist');
      var allRocos = Object.keys(ROCO_DB);
      var baseForms = allRocos.filter(function(name) { return isEvoBase(name); });
      var recordedNames = getRecordedNames(records);
      var missing = baseForms.filter(function(name) { return recordedNames.indexOf(name) === -1; });

      if (missing.length === 0) {
        container.innerHTML = '<div style="color:#a0aec0; text-align:center; padding:20px 0;">已收集所有基礎型態的異色精靈！</div>';
        return;
      }

      container.innerHTML = missing.map(function(name) {
        var checked = excludeList.indexOf(name) !== -1 ? 'checked' : '';
        var data = ROCO_DB[name];
        var eggDisplay = data.eggGroups.join('、');
        var evoChain = getEvolutionChain(name);
        var evoDisplay = evoChain.length > 1 ? ' → ' + evoChain.slice(1).join(' → ') : '';
        var inWishlist = wishlist.indexOf(name) !== -1;
        return '<label style="display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; border-bottom: 1px solid #f0f0f0;">' +
          '<input type="checkbox" class="exclude-checkbox" value="' + name + '" ' + checked + '>' +
          '<span class="exclude-name" style="font-weight: 500;">' + name + '</span>' +
          '<span style="font-size:0.75rem; color:#a0aec0;">（' + eggDisplay + '·' + data.season + evoDisplay + '）</span>' +

            if (confirmed) {
              records.splice(idx, 1);
              saveRecords(records);
              renderTable();
              renderRecommendations();
            }
          });
        });
      });

      tbody.querySelectorAll('.btn-fix').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(this.dataset.fixIndex);
          var record = records[idx];
          showFixDialog(idx, record);
        });
      });
    }

    // ---------- 顯示修改舊版精靈對話框 ----------
    function showFixDialog(index, record) {
      var name = record.name;
      var options = [];
      var title = '';
      var message = '';

      if (['地鼠', '遁鼠', '遁地鼠'].indexOf(name) !== -1) {
        title = '修改「' + name + '」為正確樣子';
        message = '「' + name + '」已拆分為「儲水期」和「枯水期」兩種樣子，請選擇正確的樣子：';
        var baseName = name === '地鼠' ? '地鼠' : name === '遁鼠' ? '遁鼠' : '遁地鼠';
        options = [
          { value: baseName + '（儲水期）', label: baseName + '（儲水期）' },
          { value: baseName + '（枯水期）', label: baseName + '（枯水期）' }
        ];
      } else if (['海盔蟲', '刺盔蟲', '千棘盔'].indexOf(name) !== -1) {
        title = '修改「' + name + '」為正確樣子';
        message = '「' + name + '」已拆分為「本來」和「磨損」兩種樣子，請選擇正確的樣子：';
        var baseName2 = name;
        options = [
          { value: baseName2 + '（本來）', label: baseName2 + '（本來）' },
          { value: baseName2 + '（磨損）', label: baseName2 + '（磨損）' }
        ];
      } else {
        return;
      }

      var overlay = document.createElement('div');
      overlay.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 10001; display: flex; justify-content: center; align-items: center;';

      var box = document.createElement('div');
      box.style.cssText = 'background: white; border-radius: 20px; padding: 24px; max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3);';

      box.innerHTML = '<h3 style="margin-top: 0; color: ' + (document.body.classList.contains('dark-mode') ? '#e2e8f0' : '#2d3748') + ';">' + title + '</h3>' +
        '<p style="font-size: 0.9rem; color: ' + (document.body.classList.contains('dark-mode') ? '#a0aec0' : '#4a5568') + '; white-space: pre-line;">' + message + '</p>' +
        '<div style="margin: 16px 0;">' +
        options.map(function(opt) {
          return '<label style="display: block; padding: 8px 12px; margin: 4px 0; background: ' + (document.body.classList.contains('dark-mode') ? '#4a5568' : '#f7fafc') + '; border-radius: 8px; cursor: pointer;">' +
            '<input type="radio" name="fixOption" value="' + opt.value + '" style="margin-right: 10px;">' +
            opt.label +
            '</label>';
        }).join('') +
        '</div>' +
        '<div style="display: flex; gap: 8px; justify-content: flex-end; padding-top: 12px; border-top: 1px solid ' + (document.body.classList.contains('dark-mode') ? '#4a5568' : '#e2e8f0') + ';">' +
        '<button class="btn btn-sm" id="fixCancel" style="background: ' + (document.body.classList.contains('dark-mode') ? '#4a5568' : '#e2e8f0') + '; color: ' + (document.body.classList.contains('dark-mode') ? '#e2e8f0' : '#2d3748') + ';">取消</button>' +
        '<button class="btn btn-primary btn-sm" id="fixConfirm" style="background: #6c5ce7; color: white; border: none; border-radius: 40px; padding: 6px 18px; font-size: 0.9rem; cursor: pointer;">確認修改</button>' +
        '</div>';

      overlay.appendChild(box);
      document.body.appendChild(overlay);

      overlay.querySelector('#fixCancel').addEventListener('click', function() {
        overlay.remove();
      });

      overlay.querySelector('#fixConfirm').addEventListener('click', function() {
        var selected = overlay.querySelector('input[name="fixOption"]:checked');
        if (!selected) {
          alert('請選擇一個樣子！');
          return;
        }
        var newName = selected.value;
        var rocoData = ROCO_DB[newName];
        if (rocoData) {
          records[index].name = newName;
          records[index].eggGroups = rocoData.eggGroups;
          records[index].season = rocoData.season;
          records[index].types = rocoData.types || [];
          records[index].eggGroup = rocoData.eggGroups[0];
          delete records[index].searchedName;

          saveRecords(records);
          renderTable();
          renderRecommendations();
          overlay.remove();

          setTimeout(checkDataUpdateAlert, 300);
        } else {
          alert('所選樣子不存在於資料庫中，請重新選擇。');
        }
      });

      overlay.addEventListener('click', function(e) {
        if (e.target === this) {
          this.remove();
        }
      });
    }

    // ---------- 推薦引擎 ----------
    function renderRecommendations() {
      // 確保 selectedTargets 已載入
      loadSelectedTargets();

      var area = document.getElementById('recommendationArea');
      var targetArea = document.getElementById('targetSelectionArea');

      var existingSelect = document.getElementById('prioritySeason');
      var savedSeason = existingSelect ? existingSelect.value : (localStorage.getItem('prioritySeason') || 'all');

      if (records.length === 0) {
        area.innerHTML = '<div class="rec-card" style="border-color:#d69e2e; background:#fffff0;">' +
          '<div class="title">暫無記錄</div>' +
          '<div class="detail">先新增一些異色精靈，推薦才會出現</div>' +
          '</div>';
        if (targetArea) targetArea.style.display = 'none';
        return;
      }

      var recordedGroups = getRecordedGroups(records);
      var recordedNames = getRecordedNames(records);
      var maleShinies = getMaleShinies(records);
      var femaleShinies = records.filter(function(r) { return r.gender === '母'; });

      var html = '<div class="rec-grid">';

      var allRocos = Object.keys(ROCO_DB);
      var baseForms = [];
      var evoForms = [];
      for (var i = 0; i < allRocos.length; i++) {
        var name = allRocos[i];
        if (isEvoBase(name)) {
          baseForms.push(name);
        } else {
          evoForms.push(name);
        }
      }

      var totalBaseCount = baseForms.length;
      var missingBase = baseForms.filter(function(name) { return recordedNames.indexOf(name) === -1; });
      var missingEvo = evoForms.filter(function(name) {
        var baseName = getEvoBaseName(name);
        return recordedNames.indexOf(baseName) === -1;
      });
      var missingDisplay = missingBase.slice();
      for (var j = 0; j < missingEvo.length; j++) {
        var evoName = missingEvo[j];
        var baseName2 = getEvoBaseName(evoName);
        if (missingDisplay.indexOf(baseName2) === -1 && recordedNames.indexOf(baseName2) === -1) {
          missingDisplay.push(baseName2);
        }
      }

      var ownedSpecies = 0;
      for (var k = 0; k < baseForms.length; k++) {
        var baseName3 = baseForms[k];
        if (recordedNames.indexOf(baseName3) !== -1) {
          ownedSpecies++;
          continue;
        }
        var evoChain = getEvolutionChain(baseName3);
        var found = false;
        for (var m = 0; m < evoChain.length; m++) {
          if (recordedNames.indexOf(evoChain[m]) !== -1 && evoChain[m] !== baseName3) {
            found = true;
            break;
          }
        }
        if (found) ownedSpecies++;
      }

      var wearBreedWarning = '';
      var hasWearBase = recordedNames.indexOf('海盔蟲（磨損）') !== -1;
      var hasWearEvo = recordedNames.indexOf('刺盔蟲（磨損）') !== -1 || recordedNames.indexOf('千棘盔（磨損）') !== -1;
      var hasWearAny = hasWearBase || hasWearEvo;

      if (!hasWearAny) {
        wearBreedWarning = '<div style="background: #fff5f5; border-left: 4px solid #e53e3e; border-radius: 4px; padding: 8px 12px; margin-top: 6px; font-size: 0.85rem; color: #c53030;">' +
          '⚠️ <strong>提醒：</strong>「磨損」樣子的海盔蟲家族無法靠孵蛋取得，只能透過捕捉獲得！' +
          '</div>';
      }

      html += '<div class="rec-card" style="border-color:#bab4a7; background:#f3ede0; grid-column: 1 / -1;">' +
        '<div class="title">📊 目前圖鑑</div>' +
        '<div class="detail">' +
        '<div>異色總數：<strong>' + records.length + '</strong> 隻</div>' +
        '<div>已收集種類：<strong>' + ownedSpecies + '/' + totalBaseCount + '</strong>（不包括通行證精靈）</div>' +
        '<div>覆蓋蛋組：' + (recordedGroups.length ? recordedGroups.join('、') : '無') + '</div>' +
        '<div>可作父本（公）：' + maleShinies.length + ' 隻</div>' +
        '<div>可作母本（母）：' + femaleShinies.length + ' 隻</div>' +
        (missingDisplay.length > 0 ? '<div>尚未擁有：' + missingDisplay.join('、') + '</div>' : '') +
        wearBreedWarning +
        '</div>' +
        '</div>';

      var missingSpecies = missingDisplay;
      var isComplete = missingSpecies.length === 0;

      var slotHtml = '<div class="slot-grid">';
      var totalSlots = 10;

      if (!isComplete && maleShinies.length > 0) {
        // ===== 反向遷移：從集齊後的數字鍵遷移回未集齊的字串鍵 =====
        for (var reverseIdx = 0; reverseIdx < totalSlots / 2; reverseIdx++) {
          if (selectedTargets[reverseIdx] !== undefined) {
            var selfKey = 'slot_' + reverseIdx;
            if (selectedTargets[selfKey] === undefined) {
              selectedTargets[selfKey] = selectedTargets[reverseIdx];
            }
          }
        }

        var filteredMissing = missingSpecies.filter(function(name) {
          if (excludeList.indexOf(name) !== -1) return false;
          if (name === '海盔蟲（磨損）' || name === '刺盔蟲（磨損）' || name === '千棘盔（磨損）') return false;
          return true;
        });

        var wishlistDirect = [];
        var wishlistIndirect = [];
        var nonWishlistDirect = [];
        var nonWishlistIndirect = [];

        for (var p = 0; p < filteredMissing.length; p++) {
          var targetName = filteredMissing[p];
          var targetData = ROCO_DB[targetName];
          if (!targetData) continue;

          var canDirect = false;
          for (var q = 0; q < targetData.eggGroups.length; q++) {
            var group = targetData.eggGroups[q];
            var dads = maleShinies.filter(function(m) {
              var mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
              return mGroups.indexOf(group) !== -1;
            });
            if (dads.length > 0) {
              canDirect = true;
              break;
            }
          }

          var inWishlist = wishlist.indexOf(targetName) !== -1;

          if (inWishlist && canDirect) {
            wishlistDirect.push(targetName);
          } else if (inWishlist && !canDirect) {
            wishlistIndirect.push(targetName);
          } else if (!inWishlist && canDirect) {
            nonWishlistDirect.push(targetName);
          } else {
            nonWishlistIndirect.push(targetName);
          }
        }

        var sortedMissing = wishlistDirect.concat(wishlistIndirect, nonWishlistDirect, nonWishlistIndirect);

        var prioritySeasonEl = document.getElementById('prioritySeason');
        if (prioritySeasonEl) {
          var prioritySeason2 = prioritySeasonEl.value;
          if (prioritySeason2 !== 'all') {
            var priorityList = [];
            var nonPriorityList = [];
            for (var r2 = 0; r2 < sortedMissing.length; r2++) {
              var name2 = sortedMissing[r2];
              var data2 = ROCO_DB[name2];
              if (data2 && data2.season === prioritySeason2) {
                priorityList.push(name2);
              } else {
                nonPriorityList.push(name2);
              }
            }
            sortedMissing = priorityList.concat(nonPriorityList);
          }
        }

        if (sortedMissing.length === 0) {
          // 顯示提示文字 + 可自選的空窩位（10個窩位）
          var emptySlotHtml = '<div class="slot-grid">';
          for (var emptyIdx = 0; emptyIdx < totalSlots; emptyIdx++) {
            var isFirstEmpty = emptyIdx % 2 === 0;
            var pairNum = Math.floor(emptyIdx / 2) + 1;
            // 使用與未集齊自選空位相同的樣式：可點擊選擇
            emptySlotHtml += '<div class="slot-pair" style="cursor:pointer; border-color:#e2e8f0; background:#f7fafc; min-height:80px; transition:0.2s;" onclick="openSelfTargetSelect(' + (emptyIdx % 2 === 0 ? Math.floor(emptyIdx / 2) : Math.floor(emptyIdx / 2)) + ')">' +
              '<div class="slot-label">' + (isFirstEmpty ? '〈 窩位 ' + pairNum : '窩位 ' + pairNum + ' 〉') + '</div>' +
              '<div class="slot-content">' +
              '<span style="font-weight:700; font-size:0.9rem; color:#a0aec0;">點擊選擇</span>' +
              '</div>' +
              '</div>';
          }
          emptySlotHtml += '</div>';
          
          slotHtml = '<div style="grid-column: 1 / -1; text-align: center; padding: 12px 0 4px 0; color: #a0aec0; font-size: 0.9rem;">' +
            '所有尚未擁有的精靈都已加入排除清單。點擊「管理」取消排除，或點擊下方窩位自選目標。' +
            '</div>' +
            emptySlotHtml;
        } else {
          var usedDadIndices = {};
          var recommendations = [];

          for (var s = 0; s < sortedMissing.length; s++) {
            var missingName = sortedMissing[s];
            var targetData3 = ROCO_DB[missingName];
            if (!targetData3) continue;

            var availableDad = null;
            var availableDadIndex = -1;
            var usedGroup = null;

            for (var t = 0; t < targetData3.eggGroups.length; t++) {
              var group2 = targetData3.eggGroups[t];
              var dads2 = maleShinies.filter(function(m, idx) {
                var mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                return mGroups.indexOf(group2) !== -1 && !usedDadIndices[idx];
              });
              if (dads2.length > 0) {
                availableDad = dads2[0];
                availableDadIndex = maleShinies.indexOf(availableDad);
                usedGroup = group2;
                break;
              }
            }

            if (availableDad) {
              usedDadIndices[availableDadIndex] = true;
              recommendations.push({
                target: missingName,
                season: targetData3.season,
                dad: availableDad.name,
                dadSeason: availableDad.season,
                group: usedGroup,
                isDirect: true,
                _sortOrder: sortedMissing.indexOf(missingName)
              });
            } else {
              // 兩步孵化邏輯
              for (var u = 0; u < targetData3.eggGroups.length; u++) {
                var group3 = targetData3.eggGroups[u];
                var allInGroup = getRocosByEggGroup(group3);

                var availableAltTargets = allInGroup.filter(function(item) {
                  if (item.name === missingName) return false;
                  if (excludeList.indexOf(item.name) !== -1) return false;
                  var hasFemale = records.some(function(r) { return r.name === item.name && r.gender === '母'; });
                  if (!hasFemale) return false;
                  var hasShinyMale = records.some(function(r) { return r.name === item.name && r.gender === '公'; });
                  return !hasShinyMale;
                });

                for (var v = 0; v < availableAltTargets.length; v++) {
                  var altTarget = availableAltTargets[v];
                  var altData = ROCO_DB[altTarget.name];
                  if (!altData) continue;

                  var dadFound = null;
                  var dadIdx = -1;
                  var usedGroup2 = null;

                  for (var w = 0; w < altData.eggGroups.length; w++) {
                    var altGroup = altData.eggGroups[w];
                    var dads3 = maleShinies.filter(function(m, idx2) {
                      var mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                      return mGroups.indexOf(altGroup) !== -1 && !usedDadIndices[idx2];
                    });
                    if (dads3.length > 0) {
                      dadFound = dads3[0];
                      dadIdx = maleShinies.indexOf(dadFound);
                      usedGroup2 = altGroup;
                      break;
                    }
                  }

                  if (dadFound) {
                    usedDadIndices[dadIdx] = true;
                    recommendations.push({
                      target: missingName,
                      altTarget: altTarget.name,
                      season: altData.season,
                      dad: dadFound.name,
                      dadSeason: dadFound.season,
                      group: usedGroup2,
                      targetGroup: group3,
                      isDirect: false,
                      hasFemale: true,
                      _sortOrder: sortedMissing.indexOf(missingName)
                    });
                    break;
                  }
                }
              }
            }
          }

          recommendations.sort(function(a, b) { return a._sortOrder - b._sortOrder; });

          // ===== 處理自選目標緊貼系統推薦之後的排列邏輯 =====
          // 系統推薦佔用索引 0 到 recommendations.length-1
          var recCount = recommendations.length;

          // 收集所有自選目標（含 slot_ 前綴和數字鍵）
          var selfTargetsList = [];
          for (var stKey in selectedTargets) {
            if (selectedTargets.hasOwnProperty(stKey)) {
              var stValue = selectedTargets[stKey];
              if (!stValue) continue;
              var stSlotIndex = -1;
              if (stKey.indexOf('slot_') === 0) {
                stSlotIndex = parseInt(stKey.replace('slot_', ''), 10);
              } else {
                stSlotIndex = parseInt(stKey, 10);
              }
              if (isNaN(stSlotIndex)) continue;
              selfTargetsList.push({ slotIndex: stSlotIndex, target: stValue });
            }
          }
          // 按原窩位索引排序，保持自選目標的相對順序
          selfTargetsList.sort(function(a, b) { return a.slotIndex - b.slotIndex; });

          // 重新分配：自選目標從 recCount 開始連續排列
          var newSelectedTargets = {};
          var assignIndex = recCount;
          for (var si = 0; si < selfTargetsList.length; si++) {
            if (assignIndex >= totalSlots / 2) {
              // 所有窩位都被系統推薦和自選佔滿，捨棄剩下的自選目標
              break;
            }
            newSelectedTargets['slot_' + assignIndex] = selfTargetsList[si].target;
            assignIndex++;
          }

          // 檢查是否有變化
          var hasChanged = false;
          var oldSlotKeys = [];
          for (var oldKey in selectedTargets) {
            if (selectedTargets.hasOwnProperty(oldKey)) {
              if (oldKey.indexOf('slot_') === 0) {
                oldSlotKeys.push(oldKey);
                if (newSelectedTargets[oldKey] === undefined) {
                  hasChanged = true;
                }
              } else {
                hasChanged = true;
              }
            }
          }
          if (!hasChanged) {
            for (var newKey in newSelectedTargets) {
              if (newSelectedTargets.hasOwnProperty(newKey)) {
                if (selectedTargets[newKey] !== newSelectedTargets[newKey]) {
                  hasChanged = true;
                  break;
                }
              }
            }
          }

          // 更新 selectedTargets（只保留 slot_ 鍵）
          selectedTargets = newSelectedTargets;
          if (hasChanged) {
            saveSelectedTargets();
          }

          if (recommendations.length === 0) {
            slotHtml = '<div style="grid-column: 1 / -1; text-align: center; padding: 20px 0; color: #a0aec0;">' +
              '配種需要 <strong>異色父本</strong> 才能高效出異色子代。<br>建議優先捕捉或孵出一隻異色公精靈。' +
              '</div>';
          } else {
            var selfUsedDadIndices = {};
            for (var x = 0; x < totalSlots; x++) {
              var pairIndex = Math.floor(x / 2);
              var rec = recommendations[pairIndex] || null;
              var isFirst2 = x % 2 === 0;

              if (rec) {
                var dadData2 = ROCO_DB[rec.dad];
                var dadTypes2 = dadData2 ? dadData2.types : [];
                var dadTypeIcons2 = renderTypeIcons(dadTypes2);

                var targetData4 = ROCO_DB[rec.target];
                var targetTypes2 = targetData4 ? targetData4.types : [];
                var targetTypeIcons2 = renderTypeIcons(targetTypes2);

                if (isFirst2) {
                  if (rec.isDirect) {
                    // 判斷異色公是否存在
                    var hasShinyDad = records.some(function(r) { return r.name === rec.dad && r.gender === '公'; });
                    var dadTypeLabel = hasShinyDad ? '異色公' : '普通公';
                    var dadColor = hasShinyDad ? '#59aaff' : '#a0aec0';

                    slotHtml += '<div class="slot-pair has-recommendation">' +
                      '<div class="slot-label">〈 窩位推薦精靈 ' + (pairIndex + 1) + '</div>' +
                      '<div class="slot-content">' +
                      '<span style="display:flex; flex-direction:column; align-items:center; gap:2px;">' +
                      '<span style="display:flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap; color:' + dadColor + '; font-weight:700; text-align:center;">' +
                      '<img src="images/male.svg" alt="♂" style="width:14px;height:14px;vertical-align:middle;" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'inline\';">' +
                      '<span style="display:none;">♂</span><span>' + rec.dad + '</span><span style="font-size:0.6rem;">' + dadTypeIcons2 + '</span>' +
                      '</span>' +
                      '<span style="font-size:0.6rem; color:' + dadColor + ';">' + dadTypeLabel + '</span>' +
                      '</span>' +
                      '<span style="font-size:0.65rem; color:#a0aec0;">' +
                      rec.dadSeason + ' · ' + rec.group +
                      '<br>直接孵化 <strong style="color:#d69e2e;">' + rec.target + '（異色）</strong>' +
                      '</span>' +
                      '</div>' +
                      '</div>';
                  } else {
                    var altData2 = ROCO_DB[rec.altTarget];
                    var altTypes2 = altData2 ? altData2.types : [];
                    var altTypeIcons2 = renderTypeIcons(altTypes2);

                    slotHtml += '<div class="slot-pair has-recommendation" style="border-color:#38a169; background:#f0fff4;">' +
                      '<div class="slot-label">〈 窩位推薦精靈 ' + (pairIndex + 1) + '</div>' +
                      '<div class="slot-content">' +
                      '<span class="dad" style="display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap;">' +
                      '<img src="images/male.svg" alt="♂" style="width:14px;height:14px;vertical-align:middle;" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'inline\';">' +
                      '<span style="display:none;">♂</span><span style="color:#59aaff;">' + rec.dad + '</span><span style="font-size:0.6rem;">' + dadTypeIcons2 + '</span>' +
                      '</span>' +
                      '<span style="font-size:0.65rem; color:#a0aec0;">' +
                      rec.dadSeason + ' · ' + rec.group +
                      '<br>孵化 <strong style="color:#6c5ce7;">♂ ' + rec.altTarget + '（異色）</strong>' +
                      '<br>用以孵化 <strong style="color:#d69e2e;">' + rec.target + '（異色）</strong>' +
                      '</span>' +
                      '</div>' +
                      '</div>';
                  }
                  } else {
                  if (rec.isDirect) {
                    // 判斷異色母是否存在
                    var hasShinyMom = records.some(function(r) { return r.name === rec.target && r.gender === '母'; });
                    var momTypeLabel = hasShinyMom ? '異色母' : '普通母';

    // ---------- 更新輸入框自動補全 ----------
    function updateDatalist() {
      var datalist = document.getElementById('nameSuggest');
      var seasonFilter = document.getElementById('seasonFilter').value;
      var typeFilter = document.getElementById('typeFilter').value;

      var names = Object.keys(ROCO_DB);

      if (seasonFilter !== 'all') {
        names = names.filter(function(name) {
          var data = ROCO_DB[name];
          return data.season === seasonFilter;
        });
      }

      if (typeFilter !== 'all') {
        names = names.filter(function(name) {
          var data = ROCO_DB[name];
          return data.types && data.types.indexOf(typeFilter) !== -1;
        });
      }

      var options = [];
      var added = {};

      for (var i = 0; i < names.length; i++) {
        var name = names[i];
        if (added[name]) continue;
        options.push({ value: name, label: name });
        added[name] = true;

        for (var evoName in ROCO_DB) {
          if (ROCO_DB.hasOwnProperty(evoName)) {
            var evoData = ROCO_DB[evoName];
            if (evoData.evolvesFrom === name && !added[evoName]) {
              if (seasonFilter === 'all' || evoData.season === seasonFilter) {
                if (typeFilter === 'all' || (evoData.types && evoData.types.indexOf(typeFilter) !== -1)) {
                  options.push({ value: evoName, label: evoName });
                  added[evoName] = true;
                }
              }
            }
          }
        }
      }

      datalist.innerHTML = options.map(function(opt) {
        return '<option value="' + opt.value + '" label="' + opt.label + '">';
      }).join('');
    }

      if (!file) return;
      var reader = new FileReader();
      var fileInput = this;

      reader.onload = function(ev) {
        try {
          var data = JSON.parse(ev.target.result);

          var importedRecords = [];
          var importedExcludeList = [];
          var importedWishlist = [];
          var importedPrioritySeason = 'all';

          if (data.records && Array.isArray(data.records)) {
            importedRecords = data.records;
            importedExcludeList = data.excludeList || [];
            importedWishlist = data.wishlist || [];
            importedSelectedTargets = data.selectedTargets || {};
            importedPrioritySeason = data.prioritySeason || 'all';
          } else if (Array.isArray(data)) {
            importedRecords = data;
            importedSelectedTargets = {};
          } else {
            alert('資料格式錯誤，請匯入正確的 JSON 檔案');
            return;
          }

          var convertedRecords = importedRecords.map(function(r) {
            if (r.season && r.season.indexOf('常駐') === -1 && r.season.indexOf('賽季') === -1) {
              var rocoData = ROCO_DB[r.name];
              if (rocoData && rocoData.season) {
                r.season = rocoData.season;
              } else {
                r.season = r.season + '常駐';
              }

            if (!r.types || r.types.length === 0) {
              var rocoData2 = ROCO_DB[r.name];
              if (rocoData2 && rocoData2.types) {
                r.types = rocoData2.types;
              } else {
                r.types = [];
              }
            }
            return r;
          });

          records = convertedRecords;
          excludeList = importedExcludeList;
          wishlist = importedWishlist;
          selectedTargets = importedSelectedTargets || {};

          saveRecords(records);
          saveExcludeList();
          saveWishlist();
          saveSelectedTargets();

          renderExcludeTags();

            var prioritySeasonEl = document.getElementById('prioritySeason');

            }
          }, 300);

          setTimeout(function() {

          }, 500);

          alert('匯入成功！已匯入 ' + records.length + ' 筆記錄');

        } catch (error) {
          alert('檔案解析失敗：' + error.message);
        }

        fileInput.value = '';
      };

      reader.readAsText(file);

    function checkDataUpdateAlert() {
      var alertEl = document.getElementById('dataUpdateAlert');
      var dismissBtn = document.getElementById('dismissAlert');
      var dismissPermanentBtn = document.getElementById('dismissAlertPermanent');

      var hasSeenAlert = localStorage.getItem('dataUpdateAlert_seen_v3');

      if (!hasSeenAlert) {
        var hasOldDishu = records.some(function(r) {
          return r.name === '地鼠' || r.name === '遁鼠' || r.name === '遁地鼠';
        });
        var hasOldHaikui = records.some(function(r) {
          return r.name === '海盔蟲' || r.name === '刺盔蟲' || r.name === '千棘盔';
        });

        if (!hasOldDishu && !hasOldHaikui) {
          localStorage.setItem('dataUpdateAlert_seen_v3', 'true');
          if (alertEl) alertEl.style.display = 'none';
          return;
        }

        if (alertEl) {
          alertEl.style.display = 'block';

          var affectedList = [];
          var detailText = '';

          if (hasOldDishu) {
            var dishuList = records.filter(function(r) {
              return r.name === '地鼠' || r.name === '遁鼠' || r.name === '遁地鼠';
            }).map(function(r) {
              return r.name + '（' + r.gender + '）';
            }).join('、');
            affectedList.push('地鼠、遁鼠、遁地鼠 → 分為「儲水期」和「枯水期」');
            detailText += '已錄入的舊版地鼠家族：' + dishuList + '\n';
          }

          if (hasOldHaikui) {
            var haikuiList = records.filter(function(r) {
              return r.name === '海盔蟲' || r.name === '刺盔蟲' || r.name === '千棘盔';
            }).map(function(r) {
              return r.name + '（' + r.gender + '）';
            }).join('、');
            affectedList.push('海盔蟲、刺盔蟲、千棘盔 → 分為「本來」和「磨損」');
            detailText += '已錄入的舊版海盔蟲家族：' + haikuiList + '\n';
          }

          var titleEl = alertEl.querySelector('.alert-title');
          var affectedEl = alertEl.querySelector('.alert-affected');
          var detailEl = alertEl.querySelector('.affected-detail');

          if (titleEl) {
            titleEl.textContent = '部分精靈數據已更新！請及時修改，避免推薦錯誤！';
          }

          if (affectedEl) {
            affectedEl.innerHTML = affectedList.map(function(item) { return '• ' + item; }).join('<br>');
          }

          if (detailEl) {
            detailEl.innerHTML = detailText.trim().replace(/\n/g, '<br>');
          }
        }
      } else {
        if (alertEl) alertEl.style.display = 'none';
      }

      if (dismissBtn) {
        dismissBtn.replaceWith(dismissBtn.cloneNode(true));
        var newDismissBtn = document.getElementById('dismissAlert');
        if (newDismissBtn) {
          newDismissBtn.addEventListener('click', function() {
            var alertEl2 = document.getElementById('dataUpdateAlert');
            if (alertEl2) alertEl2.style.display = 'none';
          });
        }
      }

      if (dismissPermanentBtn) {
        dismissPermanentBtn.replaceWith(dismissPermanentBtn.cloneNode(true));
        var newDismissPermanentBtn = document.getElementById('dismissAlertPermanent');
        if (newDismissPermanentBtn) {
          newDismissPermanentBtn.addEventListener('click', function() {
            var alertEl2 = document.getElementById('dataUpdateAlert');
            if (alertEl2) {
              alertEl2.style.display = 'none';
              localStorage.setItem('dataUpdateAlert_seen_v3', 'true');
            }
          });
        }
      }
    }

    records = records.map(function(r) {
      if (ROCO_DB[r.name] && (!r.eggGroup || r.eggGroup === '未分類')) {
        r.eggGroup = ROCO_DB[r.name];
      }
      return r;
    });
    saveRecords(records);

    renderTable();
    renderRecommendations();
    updateDatalist();

    var savedPrioritySeason = localStorage.getItem('prioritySeason') || 'all';
    setTimeout(function() {
      var prioritySeasonEl = document.getElementById('prioritySeason');
      if (prioritySeasonEl) {
        prioritySeasonEl.value = savedPrioritySeason;
      }
    }, 100);

    setTimeout(function() {
      checkDataUpdateAlert();
    }, 200);

    console.log('✨ 異色精靈記錄器已啟動！資料保存在瀏覽器本地。');
    console.log('📦 目前記錄數:', records.length);
  </script>

</body>
</html>
