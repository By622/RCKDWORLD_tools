<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王國 · 異色孵蛋</title>
    <style>
        /* ===== 全域樣式 ===== */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        body {
            background: #f0f4f8;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        h1 {
            color: #2d3748;
            border-left: 6px solid #6c5ce7;
            padding-left: 16px;
            margin-top: 0;
        }
        h2 {
            color: #4a5568;
            font-size: 1.3rem;
            margin: 30px 0 16px 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 150px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
        }
        .form-group input,
        .form-group select {
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
            transition: 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #6c5ce7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            background: #e2e8f0;
            color: #2d3748;
        }
        .btn-primary {
            background: #6c5ce7;
            color: white;
        }
        .btn-primary:hover {
            background: #5a4bd1;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #fc8181;
            color: white;
            padding: 4px 14px;
            font-size: 0.85rem;
        }
        .btn-danger:hover {
            background: #f56565;
        }
        .btn-sm {
            padding: 6px 18px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        /* ===== 自訂確認對話框 ===== */
        .custom-confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .custom-confirm-box {
            background: white;
            border-radius: 20px;
            padding: 24px;
            max-width: 340px;
            width: 85%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .custom-confirm-box p {
            font-size: 1rem;
            color: #2d3748;
            margin: 0 0 20px 0;
            line-height: 1.6;
            white-space: pre-line;
        }
        .custom-confirm-box .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .custom-confirm-box .btn-group .btn {
            flex: 1;
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .custom-confirm-box .btn-cancel {
            background: #e2e8f0;
            color: #2d3748;
        }
        .custom-confirm-box .btn-confirm {
            background: #fc8181;
            color: white;
        }
        .custom-confirm-box .btn-confirm:hover {
            background: #f56565;
        }

        /* ===== 系別圖示 ===== */
        .type-icon {
            width: 22px;
            height: 22px;
            display: inline-block;
            margin: 0 1px;
            vertical-align: middle;
            border-radius: 4px;
        }

        /* 備用標籤樣式 */
        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
            margin: 0 2px;
            min-width: 20px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        /* ===== 表格 ===== */
        .table-wrap {
            overflow-x: auto;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        th {
            background: #edf2f7;
            color: #2d3748;
            padding: 12px 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .empty-row td {
            text-align: center;
            color: #a0aec0;
            padding: 30px 0;
            font-style: italic;
        }

        /* ===== 表格容器（可滾動） ===== */
        .table-scroll {
            max-height: 400px;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .table-scroll table {
            border-collapse: collapse;
            width: 100%;
        }
        .table-scroll thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .table-scroll thead th {
            background: #edf2f7;
            border-bottom: 2px solid #e2e8f0;
        }

        /* ===== 推薦卡片 ===== */
        .rec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .rec-card {
            background: #f7fafc;
            border-radius: 16px;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
        }
        .rec-card:hover {
            border-color: #6c5ce7;
            background: #faf9ff;
        }
        .rec-card .title {
            font-weight: 700;
            color: #2d3748;
            font-size: 1.1rem;
        }
        .rec-card .detail {
            font-size: 0.9rem;
            color: #4a5568;
            margin-top: 6px;
        }
        .rec-card .badge {
            display: inline-block;
            background: #6c5ce7;
            color: white;
            padding: 0 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 8px;
        }

        /* ===== 窩位擺放 ===== */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 8px;
        }
        .slot-pair {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #f7fafc;
            border-radius: 12px;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            min-height: 100px;
            transition: 0.2s;
        }
        .slot-pair.has-recommendation {
            border-color: #6c5ce7;
            background: #faf9ff;
        }
        .slot-pair .slot-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #a0aec0;
            text-align: center;
            letter-spacing: 1px;
        }
        .slot-pair .slot-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 0.85rem;
            gap: 2px;
        }
        .slot-pair .slot-content .dad {
            color: #6c5ce7;
            font-weight: 700;
        }
        .slot-pair .slot-content .mom {
            color: #38a169;
            font-weight: 700;
        }
        .slot-pair .slot-content .arrow {
            color: #a0aec0;
            font-size: 1.2rem;
        }
        .slot-pair .slot-content .empty-text {
            color: #a0aec0;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .slot-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 480px) {
            .slot-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ===== 日間/夜間模式 ===== */
        body.dark-mode {
            background: #1a202c;
        }
        body.dark-mode .container {
            background: #2d3748;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        body.dark-mode h1,
        body.dark-mode h2,
        body.dark-mode .title {
            color: #e2e8f0;
        }
        body.dark-mode .form-group label,
        body.dark-mode .detail {
            color: #a0aec0;
        }
        body.dark-mode .form-group input,
        body.dark-mode .form-group select {
            background: #4a5568;
            color: #e2e8f0;
            border-color: #4a5568;
        }
        body.dark-mode .form-group input:focus,
        body.dark-mode .form-group select:focus {
            border-color: #6c5ce7;
        }

        /* ===== 性別按鈕夜間模式 ===== */
        body.dark-mode .gender-btn {
            background: #4a5568 !important;
            color: #e2e8f0 !important;
            border-color: #4a5568 !important;
        }
        body.dark-mode .gender-btn.active {
            background: #6c5ce7 !important;
            color: white !important;
            border-color: #6c5ce7 !important;
        }
        body.dark-mode .gender-btn img {
            filter: brightness(0.8);
        }
        body.dark-mode .gender-btn.active img {
            filter: brightness(0) invert(1);
        }

        /* ===== 目前圖鑑卡片夜間模式 ===== */
        body.dark-mode .rec-card {
            background: #4a5568 !important;
            border-color: #4a5568 !important;
        }
        body.dark-mode .rec-card:hover {
            border-color: #6c5ce7 !important;
            background: #553c9a !important;
        }
        body.dark-mode .rec-card .title {
            color: #e2e8f0 !important;
        }
        body.dark-mode .rec-card .detail {
            color: #a0aec0 !important;
        }
        body.dark-mode .rec-card .detail strong {
            color: #e2e8f0 !important;
        }

        /* ===== 窩位擺放建議卡片夜間模式 ===== */
        body.dark-mode .rec-card[style*="border-color:#d69e2e"],
        body.dark-mode .rec-card[style*="background:#fffbeb"] {
            background: #4a5568 !important;
            border-color: #d69e2e !important;
        }
        body.dark-mode .rec-card[style*="border-color:#d69e2e"] .title,
        body.dark-mode .rec-card[style*="background:#fffbeb"] .title {
            color: #e2e8f0 !important;
        }
        body.dark-mode .rec-card[style*="border-color:#d69e2e"] .detail,
        body.dark-mode .rec-card[style*="background:#fffbeb"] .detail {
            color: #a0aec0 !important;
        }

        /* ===== 窩位卡片內的優先孵化賽季區塊夜間模式 ===== */
        body.dark-mode .rec-card .detail > div:first-child {
            border-bottom-color: #4a5568 !important;
        }
        body.dark-mode .rec-card .detail > div:first-child span {
            color: #e2e8f0 !important;
        }

        /* ===== 窩位擺放夜間模式 ===== */
        body.dark-mode .slot-pair {
            background: #4a5568;
            border-color: #4a5568;
        }
        body.dark-mode .slot-pair.has-recommendation {
            border-color: #6c5ce7;
            background: #553c9a;
        }
        body.dark-mode .slot-pair .slot-label {
            color: #a0aec0;
        }
        body.dark-mode .slot-pair .slot-content .empty-text {
            color: #718096;
        }
        body.dark-mode .slot-pair .slot-content .dad {
            color: #9f7aea;
        }
        body.dark-mode .slot-pair .slot-content .mom {
            color: #48bb78;
        }
        body.dark-mode .slot-pair .slot-content span {
            color: #a0aec0;
        }
        body.dark-mode .slot-pair .slot-content strong {
            color: #f6e05e;
        }
        body.dark-mode .slot-pair .slot-content strong[style*="color:#d69e2e"] {
            color: #f6e05e !important;
        }
        body.dark-mode .slot-pair .slot-content strong[style*="color:#6c5ce7"] {
            color: #9f7aea !important;
        }

        /* ===== 表格夜間模式 ===== */
        body.dark-mode th {
            background: #4a5568;
            color: #e2e8f0;
        }
        body.dark-mode td {
            border-bottom-color: #4a5568;
            color: #e2e8f0;
        }
        body.dark-mode .table-scroll {
            border-color: #4a5568;
        }
        body.dark-mode .table-scroll thead th {
            background: #4a5568;
            border-bottom-color: #4a5568;
        }

        /* ===== 按鈕夜間模式 ===== */
        body.dark-mode .btn {
            background: #4a5568;
            color: #e2e8f0;
        }
        body.dark-mode .btn-primary {
            background: #6c5ce7;
            color: white;
        }
        body.dark-mode .btn-primary:hover {
            background: #5a4bd1;
        }
        body.dark-mode .btn-danger {
            background: #e53e3e;
            color: white;
        }
        body.dark-mode .btn-danger:hover {
            background: #c53030;
        }

        /* ===== 彈窗夜間模式 ===== */
        body.dark-mode .custom-confirm-box {
            background: #2d3748;
        }
        body.dark-mode .custom-confirm-box p {
            color: #e2e8f0;
        }
        body.dark-mode .custom-confirm-box .btn-cancel {
            background: #4a5568;
            color: #e2e8f0;
        }

        /* ===== 版本紀錄彈窗夜間模式 ===== */
        body.dark-mode #versionModal > div {
            background: #2d3748;
        }
        body.dark-mode #versionModal h3 {
            color: #e2e8f0;
        }
        body.dark-mode #versionModal #versionLogContent {
            color: #a0aec0;
        }
        body.dark-mode #versionModal #versionLogContent strong {
            color: #9f7aea;
        }
        body.dark-mode #versionModal #versionLogContent div {
            border-bottom-color: #4a5568;
        }

        /* ===== 排除清單彈窗夜間模式 ===== */
        body.dark-mode #excludeModal > div {
            background: #2d3748;
        }
        body.dark-mode #excludeModal h3 {
            color: #e2e8f0;
        }
        body.dark-mode #excludeModal p {
            color: #a0aec0;
        }
        body.dark-mode #excludeModal label {
            color: #e2e8f0;
        }
        body.dark-mode #excludeModal label span {
            color: #a0aec0;
        }
        body.dark-mode #excludeModal .btn {
            background: #4a5568;
            color: #e2e8f0;
        }
        body.dark-mode #excludeModal .btn-primary {
            background: #6c5ce7;
            color: white;
        }

        /* ===== 願望清單彈窗夜間模式 ===== */
        body.dark-mode #wishlistModal > div {
            background: #2d3748;
        }
        body.dark-mode #wishlistModal h3 {
            color: #e2e8f0;
        }
        body.dark-mode #wishlistModal p {
            color: #a0aec0;
        }
        body.dark-mode #wishlistModal label {
            color: #e2e8f0;
        }
        body.dark-mode #wishlistModal label span {
            color: #a0aec0;
        }
        body.dark-mode #wishlistModal .btn {
            background: #4a5568;
            color: #e2e8f0;
        }
        body.dark-mode #wishlistModal .btn-primary {
            background: #6c5ce7;
            color: white;
        }

        /* ===== 標籤夜間模式 ===== */
        body.dark-mode #excludeTags span {
            background: #553c9a !important;
            color: #e2e8f0 !important;
        }
        body.dark-mode #wishlistTags span {
            background: #744210 !important;
            color: #f6e05e !important;
            border-color: #744210 !important;
        }

        /* ===== 優先孵化賽季下拉選單夜間模式 ===== */
        body.dark-mode #prioritySeason {
            background: #4a5568 !important;
            color: #e2e8f0 !important;
            border-color: #d69e2e !important;
        }
        body.dark-mode #prioritySeason option {
            background: #4a5568;
            color: #e2e8f0;
        }
        body.dark-mode #btnApplyPriority {
            background: #d69e2e !important;
            color: #2d3748 !important;
        }

        /* ===== 系別圖示夜間模式 ===== */
        body.dark-mode .type-icon {
            filter: brightness(0.9);
        }

        /* ===== 版本號文字夜間模式 ===== */
        body.dark-mode #versionDisplay {
            color: #a0aec0 !important;
        }

        /* ===== RWD 響應式 ===== */
        @media (max-width: 640px) {
            body {
                padding: 4px;
            }
            .container { 
                padding: 16px 12px; 
                border-radius: 16px;
            }
            .flex-row { 
                flex-direction: column; 
                gap: 8px;
            }
            .form-group { 
                flex: 1 1 100%; 
                width: 100%;
            }
            .form-group input,
            .form-group select {
                width: 100%;
            }
            .form-group select#seasonFilter {
                width: 100%;
            }
            .btn { width: 100%; }
            .rec-grid { grid-template-columns: 1fr; }
    
            /* 表格標題不換行 */
            .table-scroll th {
                white-space: nowrap;
                font-size: 0.8rem;
                padding: 8px 6px;
            }
            .table-scroll td {
                font-size: 0.8rem;
                padding: 6px 4px;
            }
            .table-scroll .btn-sm {
                padding: 4px 10px;
                font-size: 0.75rem;
            }

            /* 優先孵化賽季手機端保持同一行 */
            #prioritySeason {
                flex: 1;
                min-width: 80px;
                font-size: 0.75rem !important;
                padding: 2px 6px !important;
            }
            #btnApplyPriority {
                flex: 0 0 auto;
                padding: 3px 10px !important;
                font-size: 0.7rem !important;
            }
            .priority-season-wrapper {
                flex-wrap: nowrap !important;
                gap: 4px !important;
            }
        }

    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0; border-left: 6px solid #6c5ce7; padding-left: 16px;">異色孵蛋智能配種</h1>
        <button id="themeToggle" style="background: none; border: 2px solid #e2e8f0; border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">🌙</button>
    </div>

    <!-- ===== 輸入區域 ===== -->
    <div class="flex-row">
        <div class="form-group" style="flex: 1;">
            <label>精靈名稱</label>
            <input type="text" id="inputName" placeholder="例如：雪影娃娃" list="nameSuggest" style="height: 46px;">
            <datalist id="nameSuggest"></datalist>
        </div>
        <!-- ===== 賽季篩選 ===== -->
        <div class="form-group" style="flex: 0 0 auto; min-width: 120px;">
            <label>賽季篩選</label>
            <select id="seasonFilter" style="height: 46px;">
                <option value="all">全部</option>
                <option value="S1常駐">S1常駐</option>
                <option value="S1賽季">S1賽季</option>
                <option value="S2常駐">S2常駐</option>
                <option value="S2賽季">S2賽季</option>
                <option value="S3常駐">S3常駐</option>
                <option value="S3賽季">S3賽季</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-group" style="flex: 1;">
            <label>性別</label>
            <div style="display: flex; gap: 8px; height: 46px;">
                <button type="button" class="btn gender-btn active" data-gender="公" style="flex:1; padding: 10px; border-radius: 12px; background: #6c5ce7; color: white; border: 2px solid #6c5ce7; display: flex; align-items: center; justify-content: center; gap: 6px; height: 100%;">
                    <img src="images/male.svg" alt="公" style="width: 16px; height: 16px; filter: brightness(0) invert(1);">
                    公
                </button>
                <button type="button" class="btn gender-btn" data-gender="母" style="flex:1; padding: 10px; border-radius: 12px; background: white; color: #4a5568; border: 2px solid #e2e8f0; display: flex; align-items: center; justify-content: center; gap: 6px; height: 100%;">
                    <img src="images/female.svg" alt="母" style="width: 16px; height: 16px;">
                    母
                </button>
            </div>
            <input type="hidden" id="inputGender" value="公">
        </div>

        <div class="form-group" style="flex: 0 0 auto;">
            <label>&nbsp;</label>
            <button class="btn btn-primary" id="btnAdd" style="height: 46px;">新增記錄</button>
        </div>
    </div>

    <!-- ===== 已記錄清單 ===== -->
    <h2>我的異色圖鑑（<span id="countDisplay">0</span>）</h2>
    <div class="table-scroll">
        <table id="recordTable">
            <thead>
                <tr>
                    <th>精靈</th>
                    <th>性別</th>
                    <th>系別</th>
                    <th>蛋組</th>
                    <th>賽季</th>
                    <th style="width:80px;">操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="5">還沒有記錄，快新增第一隻異色精靈吧！</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ===== 智能推薦 ===== -->
    <h2>智能配種推薦</h2>

    <!-- ===== 管理排除清單彈窗 ===== -->

    function notifyParent() {
        try {

            // 嘗試發送訊息給父框架
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'resize',
                    height: height
                }, '*');
            }
        } catch(e) {}
    }

    // 頁面載入時和內容變更時通知
    window.addEventListener('load', function() {
        setTimeout(notifyParent, 300);
        // 監聽內容變更

        observer.observe(document.body, { childList: true, subtree: true, attributes: true });
    });

    // ---------- 輔助函式 ----------

    // ---------- 尋找進化鏈起點（初階精靈） ----------
    function findEvoBase(name) {
        const data = ROCO_DB[name];
        // 如果該精靈本身是基礎型態（沒有 evolvesFrom），返回自身
        if (data && !data.evolvesFrom) {
            return { name: name, data: data };
        }
        // 如果有 evolvesFrom，遞迴往上找
        if (data && data.evolvesFrom) {
            return findEvoBase(data.evolvesFrom);
        }
        return null;
    }

    // ---------- 取得進化鏈（從基礎型態到最終進化） ----------
    function getEvolutionChain(baseName) {
        const chain = [baseName];
        let current = baseName;
        // 查找 evolvesFrom 等於 current 的精靈（往上找進化型）
        let found = true;
        while (found) {
            found = false;
            for (const [name, data] of Object.entries(ROCO_DB)) {
                if (data.evolvesFrom === current && !chain.includes(name)) {
                    chain.push(name);
                    current = name;
                    found = true;
                    break;
                }
            }
        }
        return chain;
    }

    // ---------- 檢查是否為進化鏈中的基礎型態 ----------
    function isEvoBase(name) {
        const data = ROCO_DB[name];
        // 如果有 evolvesFrom 則不是基礎型態
        if (data && data.evolvesFrom) return false;
        // 沒有 evolvesFrom 就是基礎型態
        return true;
    }

    // ---------- 取得某精靈的基礎型態（如果是進化型） ----------
    function getEvoBaseName(name) {
        const base = findEvoBase(name);
        return base ? base.name : name;
    }

    // ---------- 渲染系別圖示 ----------
    function renderTypeIcons(types) {
        if (!types || types.length === 0) return '';
        
        return types.map(type => {
            const icon = TYPE_ICONS[type];
            const color = TYPE_COLORS[type] || '#999';
        
            if (icon) {
                // 使用外部圖片
                return `<img src="${icon}" alt="${type}" class="type-icon" title="${type}" style="width:22px;height:22px;display:inline-block;margin:0 1px;vertical-align:middle;">`;
            } else {
                // 備用：使用彩色標籤
                return `<span class="type-badge" style="background:${color};">${type}</span>`;
            }
        }).join('');
    }

    // 取得某個蛋組下所有已知精靈名稱
    function getRocosByEggGroup(group) {
        const result = [];
        for (const [name, data] of Object.entries(ROCO_DB)) {
            if (data.eggGroups.includes(group)) {
                result.push({ name, season: data.season });
            }
        }
        // 依賽季排序（早賽季優先）
        result.sort((a, b) => (SEASON_PRIORITY[a.season] || 999) - (SEASON_PRIORITY[b.season] || 999));
        return result;
    }

    // 取得所有已記錄的精靈名稱（去重）
    function getRecordedNames(records) {
        const set = new Set();
        records.forEach(r => set.add(r.name));
        return set;
    }

    // 取得所有已記錄的蛋組（去重）
    function getRecordedGroups(records) {
        const set = new Set();
        records.forEach(r => {
            if (Array.isArray(r.eggGroups)) {
                r.eggGroups.forEach(g => set.add(g));
            } else {
                set.add(r.eggGroup); // 向後相容舊資料
            }
        });
        return set;
    }

    function getEggGroupsForRoco(name) {

    // ---------- 推薦引擎（重構版） ----------
    function renderRecommendations() {
        const area = document.getElementById('recommendationArea');
        const targetArea = document.getElementById('targetSelectionArea');
        
        // 從 localStorage 讀取優先賽季（唯一數據源）
        const savedSeason = localStorage.getItem('prioritySeason') || 'all';
        
        if (records.length === 0) {
            area.innerHTML = `
                <div class="rec-card" style="border-color:#d69e2e; background:#fffff0;">
                    <div class="title">暫無記錄</div>
                    <div class="detail">先新增一些異色精靈，推薦才會出現</div>
                </div>
            `;
            targetArea.style.display = 'none';
            return;
        }

        const recordedGroups = getRecordedGroups(records);
        const recordedNames = getRecordedNames(records);
        const maleShinies = getMaleShinies(records);
        const femaleShinies = records.filter(r => r.gender === '母');

        let html = '<div class="rec-grid">';

        // ----- 推薦1：目前圖鑑（保留） -----
        const allRocos = Object.keys(ROCO_DB);
        
        // 分組：基礎型態 vs 進化型
        const baseForms = [];
        const evoForms = [];
        for (const name of allRocos) {
            if (isEvoBase(name)) {
                baseForms.push(name);
            } else {
                evoForms.push(name);
            }
        }
        
        // 總基礎型態數量
        const totalBaseCount = baseForms.length;
        
        // 計算真正缺少的精靈（基礎型態中沒有的 + 進化型中沒有對應基礎型態的）
        const missingBase = baseForms.filter(name => !recordedNames.has(name));
        // 進化型中，如果對應的基礎型態已擁有，則不算缺少
        const missingEvo = evoForms.filter(name => {
            const baseName = getEvoBaseName(name);
            return !recordedNames.has(baseName);
        });
        // 合併缺少清單（只顯示基礎型態名稱）
        const missingDisplay = [...missingBase];
        // 對於進化型缺少但基礎型態也缺少的，不重複顯示
        for (const evoName of missingEvo) {
            const baseName = getEvoBaseName(evoName);
            if (!missingDisplay.includes(baseName) && !recordedNames.has(baseName)) {
                missingDisplay.push(baseName);
            }
        }

        // 計算已收集種類（以基礎型態為單位）
        // 如果玩家擁有基礎型態或其任何進化型的記錄，就算已收集
        let ownedSpecies = 0;
        for (const baseName of baseForms) {
            // 檢查玩家是否有該基礎型態的記錄
            if (recordedNames.has(baseName)) {
                ownedSpecies++;
                continue;
            }
            // 檢查玩家是否有該基礎型態的進化型記錄
            const evoChain = getEvolutionChain(baseName);
            for (const evoName of evoChain) {
                if (recordedNames.has(evoName) && evoName !== baseName) {
                    ownedSpecies++;
                    break;
                }
            }
        }

        html += `
            <div class="rec-card" style="border-color:#6c5ce7; background:#faf9ff; grid-column: 1 / -1;">
                <div class="title">📊 目前圖鑑</div>
                <div class="detail">
                    <div>異色總數：<strong>${records.length}</strong> 隻</div>
                    <div>已收集種類：<strong>${ownedSpecies}/${totalBaseCount}</strong>（不包括通行證精靈）</div>
                    <div>覆蓋蛋組：${recordedGroups.size ? Array.from(recordedGroups).join('、') : '無'}</div>
                    <div>可作父本（公）：${maleShinies.length} 隻</div>
                    <div>可作母本（母）：${femaleShinies.length} 隻</div>
                    ${missingDisplay.length > 0 ? `<div>尚未擁有：${missingDisplay.join('、')}</div>` : ''}
                </div>
            </div>
        `;

        // 更新 missingSpecies（用於後續推薦）
        const missingSpecies = missingDisplay;

        // ===== 判斷是否集齊所有精靈（以基礎型態為單位） =====
        const isComplete = missingSpecies.length === 0;

        // ----- 推薦2：窩位擺放建議（10個slot，兩兩一組） -----
        if (!isComplete && maleShinies.length > 0) {
            // 過濾排除清單（使用者不想孵化的精靈）
            const filteredMissing = missingSpecies.filter(name => !excludeList.includes(name));
            
            // 先分組：願望清單優先，同時直接孵化優先於兩步孵化
            const wishlistDirect = [];     // 願望清單 + 可直接孵化
            const wishlistIndirect = [];   // 願望清單 + 需要兩步孵化
            const nonWishlistDirect = [];  // 非願望清單 + 可直接孵化
            const nonWishlistIndirect = [];// 非願望清單 + 需要兩步孵化
            
            for (const name of filteredMissing) {
                const targetData = ROCO_DB[name];
                if (!targetData) continue;
                
                // 檢查是否可直接孵化
                let canDirect = false;
                for (const group of targetData.eggGroups) {
                    const dads = maleShinies.filter((m, idx) => {
                        const mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                        return mGroups.includes(group);
                    });
                    if (dads.length > 0) {
                        canDirect = true;
                        break;
                    }
                }
                
                const inWishlist = wishlist.includes(name);
                
                if (inWishlist && canDirect) {
                    wishlistDirect.push(name);
                } else if (inWishlist && !canDirect) {
                    wishlistIndirect.push(name);
                } else if (!inWishlist && canDirect) {
                    nonWishlistDirect.push(name);
                } else {
                    nonWishlistIndirect.push(name);
                }
            }
            
            // 合併：願望清單(直接) → 願望清單(兩步) → 非願望清單(直接) → 非願望清單(兩步)
            const sortedMissing = [...wishlistDirect, ...wishlistIndirect, ...nonWishlistDirect, ...nonWishlistIndirect];
            
            // ===== 賽季優先排序 =====
            const prioritySeasonEl = document.getElementById('prioritySeason');
            if (prioritySeasonEl) {
                const prioritySeason = prioritySeasonEl.value;
                if (prioritySeason !== 'all') {
                    // 將符合優先賽季的精靈移到最前面
                    const priorityList = [];
                    const nonPriorityList = [];
                    for (const name of sortedMissing) {
                        const data = ROCO_DB[name];
                        if (data && data.season === prioritySeason) {
                            priorityList.push(name);
                        } else {
                            nonPriorityList.push(name);
                        }
                    }
                    // 重新組裝：優先賽季的在前，其他的在後
                    const reordered = [...priorityList, ...nonPriorityList];
                    // 更新 sortedMissing
                    sortedMissing.length = 0;
                    sortedMissing.push(...reordered);
                }
            }
            
            if (sortedMissing.length === 0) {
                // 所有未擁有的精靈都被排除了
                html += `
                    <div class="rec-card" style="border-color:#d69e2e; background:#fffbeb; grid-column: 1 / -1;">
                        <div class="title">暫無推薦</div>
                        <div class="detail">
                            所有尚未擁有的精靈都已加入排除清單。<br>
                            點擊「管理」取消排除，或新增更多異色精靈。
                        </div>
                    </div>
                `;
            } else {
                // 建立推薦組合清單（目標精靈 -> 可用父本）
                const usedDadIndices = new Set();
                const recommendations = [];
                
                // 先處理可以直接配對的 sortedMissing
                let remainingMissing = [];
                
                for (const missingName of sortedMissing) {
                    const targetData = ROCO_DB[missingName];
                    if (!targetData) continue;
                    
                    let availableDad = null;
                    let availableDadIndex = -1;
                    let usedGroup = null;
                    
                    for (const group of targetData.eggGroups) {
                        const dads = maleShinies.filter((m, idx) => {
                            const mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                            return mGroups.includes(group) && !usedDadIndices.has(idx);
                        });
                        if (dads.length > 0) {
                            availableDad = dads[0];
                            availableDadIndex = maleShinies.indexOf(availableDad);
                            usedGroup = group;
                            break;
                        }
                    }
                    
                    if (availableDad) {
                        usedDadIndices.add(availableDadIndex);
                        recommendations.push({
                            target: missingName,
                            season: targetData.season,
                            dad: availableDad.name,
                            dadSeason: availableDad.season,
                            group: usedGroup,
                            isDirect: true,
                            _sortOrder: sortedMissing.indexOf(missingName)
                        });
                    } else {
                        remainingMissing.push({ name: missingName, data: targetData });
                    }
                }

                // ===== 處理無法直接配對的目標（兩步孵化推薦） =====
                for (const { name: missingName, data: targetData } of remainingMissing) {
                    for (const group of targetData.eggGroups) {
                        const allInGroup = getRocosByEggGroup(group);
                        
                        const availableAltTargets = allInGroup.filter(item => {
                            if (item.name === missingName) return false;
                            if (excludeList.includes(item.name)) return false;
                            const hasFemale = records.some(r => r.name === item.name && r.gender === '母');
                            if (!hasFemale) return false;
                            const hasShinyMale = records.some(r => r.name === item.name && r.gender === '公');
                            return !hasShinyMale;
                        });
                        
                        for (const altTarget of availableAltTargets) {
                            const altData = ROCO_DB[altTarget.name];
                            if (!altData) continue;
                            
                            let availableDad = null;
                            let availableDadIndex = -1;
                            let usedGroup = null;
                            
                            for (const altGroup of altData.eggGroups) {
                                const dads = maleShinies.filter((m, idx) => {
                                    const mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                                    return mGroups.includes(altGroup) && !usedDadIndices.has(idx);
                                });
                                if (dads.length > 0) {
                                    availableDad = dads[0];
                                    availableDadIndex = maleShinies.indexOf(availableDad);
                                    usedGroup = altGroup;
                                    break;
                                }
                            }
                            
                            if (availableDad) {
                                usedDadIndices.add(availableDadIndex);
                                recommendations.push({
                                    target: missingName,
                                    altTarget: altTarget.name,
                                    season: altData.season,
                                    dad: availableDad.name,
                                    dadSeason: availableDad.season,
                                    group: usedGroup,
                                    targetGroup: group,
                                    isDirect: false,
                                    hasFemale: true,
                                    _sortOrder: sortedMissing.indexOf(missingName)
                                });
                                break;
                            }
                        }
                    }
                }

                // ===== 按照 sortedMissing 的順序排序 =====
                recommendations.sort((a, b) => a._sortOrder - b._sortOrder);

                if (recommendations.length === 0) {
                    html += `
                        <div class="rec-card" style="border-color:#e53e3e; background:#fff5f5; grid-column: 1 / -1;">
                            <div class="title">缺少異色公精靈</div>

                                配種需要 <strong>異色父本</strong> 才能高效出異色子代。<br>
                                建議優先捕捉或孵出一隻異色公精靈。
                            </div>
                        </div>
                    `;
                } else {
                    let slotHtml = '<div class="slot-grid">';
                    const totalSlots = 10;
                    
                    for (let i = 0; i < totalSlots; i++) {
                        const pairIndex = Math.floor(i / 2);
                        const rec = recommendations[pairIndex] || null;
                        const isFirst = i % 2 === 0;
                        
                        if (rec) {
                            if (isFirst) {
                                if (rec.isDirect) {
                                    slotHtml += `
                                        <div class="slot-pair has-recommendation">
                                            <div class="slot-label">〈 窩位 ${pairIndex + 1}</div>
                                            <div class="slot-content">
                                                <span class="dad">
                                                    <img src="images/male.svg" alt="♂" style="width:14px;height:14px;vertical-align:middle;margin-right:2px;" onerror="this.style.display='none';this.nextSibling.style.display='inline';"> 
                                                    <span style="display:none;">♂</span> <span style="color:#59aaff;">${rec.dad}</span>
                                                </span>
                                                <span style="font-size:0.65rem; color:#a0aec0;">
                                                    ${rec.dadSeason} · ${rec.group}
                                                    <br>直接孵化 <strong style="color:#d69e2e;">${rec.target}（異色）</strong>
                                                </span>
                                            </div>
                                        </div>
                                    `;
                                } else {
                                    slotHtml += `
                                        <div class="slot-pair has-recommendation" style="border-color:#38a169; background:#f0fff4;">
                                            <div class="slot-label">〈 窩位 ${pairIndex + 1}</div>
                                            <div class="slot-content">
                                                <span class="dad">
                                                    <img src="images/male.svg" alt="♂" style="width:14px;height:14px;vertical-align:middle;margin-right:2px;" onerror="this.style.display='none';this.nextSibling.style.display='inline';"> 
                                                    <span style="display:none;">♂</span> <span style="color:#59aaff;">${rec.dad}</span>
                                                </span>
                                                <span style="font-size:0.65rem; color:#a0aec0;">
                                                    ${rec.dadSeason} · ${rec.group}
                                                    <br>孵化 <strong style="color:#6c5ce7;">♂ ${rec.altTarget}（異色）</strong>
                                                    <br>用以孵化 <strong style="color:#d69e2e;">${rec.target}（異色）</strong>
                                                </span>
                                            </div>
                                        </div>
                                    `;
                                }
                            } else {
                                if (rec.isDirect) {
                                    slotHtml += `

                                                    <br>直接孵化 <strong style="color:#d69e2e;">${rec.target}（異色）</strong>
                                                </span>
                                            </div>
                                        </div>
                                    `;
                                } else {
                                    slotHtml += `
                                        <div class="slot-pair has-recommendation" style="border-color:#38a169; background:#f0fff4;">
                                            <div class="slot-label">窩位 ${pairIndex + 1} 〉</div>
                                            <div class="slot-content">
                                                <span class="mom">
                                                    <img src="images/female.svg" alt="♀" style="width:14px;height:14px;vertical-align:middle;margin-right:2px;" onerror="this.style.display='none';this.nextSibling.style.display='inline';">

                                                    ${rec.season} · ${rec.targetGroup}

                        } else {

                    slotHtml += '</div>';

                    html += `

                                    <span style="font-weight: 500; color: #4a5568; font-size: 0.85rem; white-space: nowrap;">優先孵化賽季：</span>
                                    <select id="prioritySeason" style="padding: 3px 8px; border: 1.5px solid #d69e2e; border-radius: 6px; font-size: 0.85rem; background: #fffbeb; color: #2d3748; outline: none; cursor: pointer;">

        // ----- 推薦3：集齊時顯示目標選擇（可勾選） -----

    // ---------- 渲染目標精靈網格（勾選用） ----------
    function renderTargetGrid() {
        const grid = document.getElementById('targetGrid');
        const allRocos = Object.keys(ROCO_DB);
        const recordedNames = getRecordedNames(records);

        let html = '';
        for (const name of allRocos) {
            const data = ROCO_DB[name];
            const hasShiny = recordedNames.has(name);
            const eggDisplay = data.eggGroups.join('、');
            html += `
                <div class="rec-card" style="cursor: pointer; ${hasShiny ? 'border-color:#6c5ce7; background:#faf9ff;' : 'opacity:0.6;'}"
                     onclick="toggleTarget('${name}')">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="target_${name}" ${hasShiny ? '' : 'disabled'}>
                        <label for="target_${name}" style="font-weight: 700; cursor: pointer;">${name}</label>
                    </div>
                    <div class="detail">
                        蛋組：${eggDisplay}<br>
                        賽季：${data.season}
                        ${hasShiny ? '<span style="color:#38a169;"> ✅ 已有異色</span>' : '<span style="color:#e53e3e;"> ⚠️ 尚未擁有</span>'}
                    </div>
                </div>
            `;
        }
        grid.innerHTML = html;
    }

    // ---------- 切換目標精靈選取 ----------
    let selectedTargets = new Set();

    function toggleTarget(name) {
        const data = ROCO_DB[name];
        if (!data) return;
        const recordedNames = getRecordedNames(records);
        if (!recordedNames.has(name)) return; // 未擁有異色不可選
        
        if (selectedTargets.has(name)) {
            selectedTargets.delete(name);
        } else {
            selectedTargets.add(name);
        }
        
        // 更新 UI 樣式
        const card = document.querySelector(`[onclick="toggleTarget('${name}')"]`);
        if (card) {
            if (selectedTargets.has(name)) {
                card.style.borderColor = '#d69e2e';
                card.style.background = '#fffbeb';
            } else {
                card.style.borderColor = '#6c5ce7';
                card.style.background = '#faf9ff';
            }
        }
    }

    // ---------- 檢查能否孵化（雙異色配種） ----------
    document.getElementById('btnCheckBreed').addEventListener('click', function() {
        const resultDiv = document.getElementById('breedResult');
        
        if (selectedTargets.size === 0) {
            resultDiv.innerHTML = `<div style="color:#e53e3e;">請至少選擇一隻目標精靈</div>`;
            return;
        }
        
        // 取得所有異色公與母
        const maleShinies = records.filter(r => r.gender === '公');
        const femaleShinies = records.filter(r => r.gender === '母');
        
        let resultHtml = '<div style="margin-top:8px;">';
        let hasAnyBreedable = false;
        
        for (const targetName of selectedTargets) {
            const targetData = ROCO_DB[targetName];
            if (!targetData) continue;
            
            // 檢查該精靈的所有蛋組
            let canBreed = false;
            let breedDetails = [];
            
            for (const group of targetData.eggGroups) {
                // 找同蛋組的異色公
                const availableMales = maleShinies.filter(m => {
                    const mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                    return mGroups.includes(group);
                });
                // 找同蛋組的異色母
                const availableFemales = femaleShinies.filter(f => {
                    const fGroups = Array.isArray(f.eggGroups) ? f.eggGroups : [f.eggGroup];
                    return fGroups.includes(group);
                });
                
                if (availableMales.length > 0 && availableFemales.length > 0) {
                    canBreed = true;
                    hasAnyBreedable = true;
                    breedDetails.push({
                        group,
                        males: availableMales.map(m => m.name).join('、'),
                        females: availableFemales.map(f => f.name).join('、')
                    });
                }
            }
            
            if (canBreed) {
                resultHtml += `
                    <div style="padding: 8px 12px; margin: 4px 0; background: #f0fff4; border-left: 4px solid #38a169; border-radius: 4px;">
                        ✅ <strong>${targetName}</strong> 可以孵化！
                        ${breedDetails.map(d => `
                            <br>&nbsp;&nbsp;└ 蛋組【${d.group}】：${d.males}（♂） × ${d.females}（♀）
                        `).join('')}
                    </div>
                `;
            } else {
                resultHtml += `
                    <div style="padding: 8px 12px; margin: 4px 0; background: #fff5f5; border-left: 4px solid #e53e3e; border-radius: 4px;">
                        ❌ <strong>${targetName}</strong> 目前無法孵化（缺少同蛋組的異色公或異色母）
                        <br>&nbsp;&nbsp;└ 需要蛋組：${targetData.eggGroups.join('、')}
                    </div>
                `;
            }
        }
        
        if (!hasAnyBreedable) {
            resultHtml += `<div style="color:#e53e3e; margin-top:8px;">⚠️ 所選目標目前皆無法孵化，請先收集更多異色精靈</div>`;
        }
        
        resultHtml += '</div>';
        resultDiv.innerHTML = resultHtml;
    });

    // ---------- 更新輸入框自動補全（支援賽季篩選 + 進化型） ----------
    function updateDatalist() {
        const datalist = document.getElementById('nameSuggest');
        const seasonFilter = document.getElementById('seasonFilter').value;
        
        let names = Object.keys(ROCO_DB);
        
        if (seasonFilter !== 'all') {
            names = names.filter(name => {
                const data = ROCO_DB[name];
                return data.season === seasonFilter;
            });
        }
        
        const options = [];
        const added = new Set();
        
        for (const name of names) {
            if (added.has(name)) continue;
            
            options.push({ value: name, label: name });
            added.add(name);
            
            // 進化型
            for (const [evoName, evoData] of Object.entries(ROCO_DB)) {
                if (evoData.evolvesFrom === name && !added.has(evoName)) {
                    if (seasonFilter === 'all' || evoData.season === seasonFilter) {
                        options.push({ value: evoName, label: evoName });
                        added.add(evoName);
                    }
                }
            }
        }
        
        datalist.innerHTML = options.map(opt => 
            `<option value="${opt.value}" label="${opt.label}">`
        ).join('');
    }

    // 自訂確認對話框
    let confirmCallback = null;

    function showConfirm(message, callback) {
        document.getElementById('confirmMessage').textContent = message;
        document.getElementById('customConfirm').style.display = 'flex';
        confirmCallback = callback;
    }

    document.getElementById('confirmCancel').addEventListener('click', function() {
        document.getElementById('customConfirm').style.display = 'none';
        if (confirmCallback) confirmCallback(false);
        confirmCallback = null;
    });

    document.getElementById('confirmOk').addEventListener('click', function() {
        document.getElementById('customConfirm').style.display = 'none';
        if (confirmCallback) confirmCallback(true);
        confirmCallback = null;
    });

    // 點擊背景關閉
    document.getElementById('customConfirm').addEventListener('click', function(e) {
        if (e.target === this) {
            this.style.display = 'none';
            if (confirmCallback) confirmCallback(false);
            confirmCallback = null;
        }
    });

    // ================================================================
    // 3. 事件綁定
    // ================================================================

    // ---------- 性別自動限制（根據精靈） ----------
    document.getElementById('inputName').addEventListener('input', function() {
        const name = this.value.trim();
        const rocoData = ROCO_DB[name];
        const genderBtns = document.querySelectorAll('.gender-btn');
        const hiddenInput = document.getElementById('inputGender');
        
        // 重置所有按鈕為可用
        genderBtns.forEach(btn => {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
        });
        
        if (rocoData && rocoData.genderLock) {
            // 如果有性別限制，禁用另一個性別按鈕
            genderBtns.forEach(btn => {
                if (btn.dataset.gender !== rocoData.genderLock) {
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                } else {
                    // 自動選取可用性別
                    hiddenInput.value = rocoData.genderLock;
                    // 更新按鈕樣式
                    genderBtns.forEach(b => {
                        b.classList.remove('active');
                        b.style.background = 'white';
                        b.style.color = '#4a5568';
                        b.style.borderColor = '#e2e8f0';
                    });
                    btn.classList.add('active');
                    btn.style.background = '#6c5ce7';
                    btn.style.color = 'white';
                    btn.style.borderColor = '#6c5ce7';
                }
            });
        }
    });

    // ---------- 性別按鈕切換 ----------
    document.querySelectorAll('.gender-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const gender = this.dataset.gender;
            const hiddenInput = document.getElementById('inputGender');
            
            // 檢查是否被禁用
            if (this.style.opacity === '0.5' || this.disabled) return;
            
            // 更新 hidden input 的值
            hiddenInput.value = gender;
            
            // 更新按鈕樣式
            document.querySelectorAll('.gender-btn').forEach(b => {
                b.classList.remove('active');
                b.style.background = 'white';
                b.style.color = '#4a5568';
                b.style.borderColor = '#e2e8f0';
                
                // 重置圖片顏色
                const img = b.querySelector('img');
                if (img) {
                    img.style.filter = 'none';
                }
            });
            
            this.classList.add('active');
            this.style.background = '#6c5ce7';
            this.style.color = 'white';
            this.style.borderColor = '#6c5ce7';
            
            // 讓選中的按鈕圖片變白
            const img = this.querySelector('img');
            if (img) {
                img.style.filter = 'brightness(0) invert(1)';
            }
        });
    });

    // ---------- 新增記錄 ----------
    document.getElementById('btnAdd').addEventListener('click', function() {
        const nameInput = document.getElementById('inputName');
        const gender = document.getElementById('inputGender').value;

        let inputName = nameInput.value.trim();
        if (!inputName) {
            alert('請輸入精靈名稱');
            return;
        }

        // 查找精靈
        let result = findRocoByName(inputName);
        let actualName = inputName;
        let rocoData = null;
        
        if (result) {
            actualName = result.name;
            rocoData = result.data;
        }
        
        // 如果找到的是進化型，尋找基礎型態
        if (rocoData && rocoData.evolvesFrom) {
            const base = findEvoBase(actualName);
            if (base && base.name) {
                actualName = base.name;
                rocoData = base.data;
            }
        }
        
        if (!rocoData) {
            alert(`「${inputName}」不在資料庫中，且找不到對應的初階形態`);
            return;
        }

        // 儲存時記錄初階精靈名稱
        records.push({
            name: actualName,
            gender,
            eggGroups: rocoData.eggGroups,
            season: rocoData.season,
            eggGroup: rocoData.eggGroups[0],
            types: rocoData.types || [],
            searchedName: inputName !== actualName ? inputName : undefined
        });
        saveRecords(records);
        renderTable();
        renderRecommendations();
        nameInput.value = '';
        nameInput.focus();
    });

    // 按下 Enter 快速新增
    document.getElementById('inputName').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('btnAdd').click();
    });

    // ---------- 重新整理推薦 ----------
    document.getElementById('btnRefresh').addEventListener('click', renderRecommendations);

    // ---------- 賽季篩選變更時更新自動補全 ----------
    document.getElementById('seasonFilter').addEventListener('change', function() {
        updateDatalist();
    });

    // ---------- 優先賽季套用（事件委託） ----------
    document.addEventListener('click', function(e) {
        if (e.target && e.target.id === 'btnApplyPriority') {
            // 儲存優先賽季到 localStorage
            const prioritySeasonEl = document.getElementById('prioritySeason');
            if (prioritySeasonEl) {
                localStorage.setItem('prioritySeason', prioritySeasonEl.value);
            }
            renderRecommendations();
        }
    });

    // ---------- 匯出資料 ----------
    document.getElementById('btnExport').addEventListener('click', function() {
        // 從 localStorage 讀取優先賽季
        const prioritySeason = localStorage.getItem('prioritySeason') || 'all';
        
        const exportData = {
            records: records,
            excludeList: excludeList,
            wishlist: wishlist,
            prioritySeason: prioritySeason,
            version: "1.1",
            exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `異色精靈記錄_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    });

    // ---------- 匯入資料按鈕 ----------
    document.getElementById('btnImport').addEventListener('click', function() {
        document.getElementById('fileInput').click();
    });

    // ---------- 匯入資料 ----------
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        const fileInput = this;  // 保存 fileInput 的引用
        
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                
                let importedRecords = [];
                let importedExcludeList = [];
                let importedWishlist = [];
                let importedPrioritySeason = 'all';
                
                // 判斷是新版格式還是舊版格式
                if (data.records && Array.isArray(data.records)) {
                    importedRecords = data.records;
                    importedExcludeList = data.excludeList || [];
                    importedWishlist = data.wishlist || [];
                    importedPrioritySeason = data.prioritySeason || 'all';
                } else if (Array.isArray(data)) {
                    importedRecords = data;
                } else {
                    alert('資料格式錯誤，請匯入正確的 JSON 檔案');
                    return;
                }
                
                // ===== 轉換舊資料格式 =====
                const convertedRecords = importedRecords.map(r => {
                    if (r.season && !r.season.includes('常駐') && !r.season.includes('賽季')) {
                        const rocoData = ROCO_DB[r.name];
                        if (rocoData && rocoData.season) {
                            r.season = rocoData.season;
                        } else {
                            r.season = r.season + '常駐';
                        }
                    }
                    
                    if (!r.types || r.types.length === 0) {
                        const rocoData = ROCO_DB[r.name];
                        if (rocoData && rocoData.types) {
                            r.types = rocoData.types;
                        } else {
                            r.types = [];
                        }
                    }
                    
                    return r;
                });
                
                records = convertedRecords;
                excludeList = importedExcludeList;
                wishlist = importedWishlist;
                
                saveRecords(records);
                saveExcludeList();
                saveWishlist();
                
                // 保存優先賽季到 localStorage
                if (importedPrioritySeason) {
                    localStorage.setItem('prioritySeason', importedPrioritySeason);
                }
                
                renderTable();
                renderExcludeTags();
                
                // 先渲染推薦，然後設定優先賽季
                renderRecommendations();
                
                // 再次設定優先賽季（因為 renderRecommendations 會重建 select）
                setTimeout(function() {
                    const prioritySeasonEl = document.getElementById('prioritySeason');
                    if (prioritySeasonEl && importedPrioritySeason) {
                        prioritySeasonEl.value = importedPrioritySeason;
                        // 最後一次渲染以應用
                        renderRecommendations();
                    }
                }, 300);
                
                alert(`匯入成功！已匯入 ${records.length} 筆記錄`);
                
            } catch (error) {
                alert('檔案解析失敗：' + error.message);
            }
            
            // 清空 fileInput，允許重複選擇同一個檔案
            fileInput.value = '';
        };
        
        reader.readAsText(file);
    });

    // ---------- 清空資料 ----------
    document.getElementById('btnClear').addEventListener('click', function() {
        showConfirm('確定要清空所有記錄嗎？\n此操作無法復原！', function(confirmed) {
            if (confirmed) {
                records = [];
                excludeList = [];
                wishlist = [];
                saveRecords(records);
                saveExcludeList();
                saveWishlist();
                renderTable();
                renderRecommendations();
                renderExcludeTags();
                renderWishlistTags();
            }
        });
    });

    // ---------- 日間/夜間模式切換 ----------
    const themeToggle = document.getElementById('themeToggle');
    
    // 檢查 localStorage 是否有儲存主題偏好
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '☀️';
    }
    
    themeToggle.addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        this.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // ===== 版本號點擊顯示更新紀錄 =====
    document.getElementById('versionDisplay').addEventListener('click', function() {
        const modal = document.getElementById('versionModal');
        const content = document.getElementById('versionLogContent');
        
        // 直接使用全域變數 VERSION_DATA
        if (typeof VERSION_DATA !== 'undefined' && VERSION_DATA.versions) {
            let html = '';
            for (const v of VERSION_DATA.versions) {
                html += `
                    <div style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong style="color: #6c5ce7; font-size: 1rem;">${v.version}</strong>
                            <span style="color: #a0aec0; font-size: 0.8rem;">${v.date}</span>
                        </div>
                        <ul style="margin: 6px 0 0 0; padding-left: 20px;">
                            ${v.changes.map(c => `<li>${c}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            content.innerHTML = html;
        } else {
            content.innerHTML = `
                <div style="text-align: center; color: #e53e3e; padding: 20px 0;">
                    ⚠️ 無法載入版本紀錄
                </div>
            `;
        }
        modal.style.display = 'flex';
    });

    // ---------- 關閉版本紀錄彈窗 ----------
    document.getElementById('versionModalClose').addEventListener('click', function() {
        document.getElementById('versionModal').style.display = 'none';
    });

    document.getElementById('versionModal').addEventListener('click', function(e) {
        if (e.target === this) {
            this.style.display = 'none';
        }
    });

    // ================================================================
    // 4. 初始化
    // ================================================================

    // 如果資料庫中已有精靈但蛋組缺失，嘗試補上
    records = records.map(r => {
        if (ROCO_DB[r.name] && (!r.eggGroup || r.eggGroup === '未分類')) {
            r.eggGroup = ROCO_DB[r.name];
        }
        return r;
    });
    saveRecords(records);

    renderTable();
    renderRecommendations();
    updateDatalist();

    // ===== 從 localStorage 恢復優先賽季 =====
    const savedPrioritySeason = localStorage.getItem('prioritySeason') || 'all';
    // 等待 renderRecommendations 完成後設定
    setTimeout(function() {
        const prioritySeasonEl = document.getElementById('prioritySeason');
        if (prioritySeasonEl) {
            prioritySeasonEl.value = savedPrioritySeason;
        }
    }, 100);

    console.log('✨ 異色精靈記錄器已啟動！資料保存在瀏覽器本地。');
    console.log('📦 目前記錄數:', records.length);
</script>

</body>
</html>
