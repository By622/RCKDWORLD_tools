<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛克王國 · 異色孵蛋</title>
    <style>
        /* ===== 全域樣式 ===== */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        body {
            background: #f0f4f8;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        h1 {
            color: #2d3748;
            border-left: 6px solid #6c5ce7;
            padding-left: 16px;
            margin-top: 0;
        }
        h2 {
            color: #4a5568;
            font-size: 1.3rem;
            margin: 30px 0 16px 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 150px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
        }
        .form-group input,
        .form-group select {
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
            transition: 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #6c5ce7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            background: #e2e8f0;
            color: #2d3748;
        }
        .btn-primary {
            background: #6c5ce7;
            color: white;
        }
        .btn-primary:hover {
            background: #5a4bd1;
            transform: scale(1.02);
        }
        .btn-danger {
            background: #fc8181;
            color: white;
            padding: 4px 14px;
            font-size: 0.85rem;
        }
        .btn-danger:hover {
            background: #f56565;
        }
        .btn-sm {
            padding: 6px 18px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        /* ===== 自訂確認對話框 ===== */
        .custom-confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .custom-confirm-box {
            background: white;
            border-radius: 20px;
            padding: 24px;
            max-width: 340px;
            width: 85%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .custom-confirm-box p {
            font-size: 1rem;
            color: #2d3748;
            margin: 0 0 20px 0;
            line-height: 1.6;
            white-space: pre-line;
        }
        .custom-confirm-box .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .custom-confirm-box .btn-group .btn {
            flex: 1;
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .custom-confirm-box .btn-cancel {
            background: #e2e8f0;
            color: #2d3748;
        }
        .custom-confirm-box .btn-confirm {
            background: #fc8181;
            color: white;
        }
        .custom-confirm-box .btn-confirm:hover {
            background: #f56565;
        }

        /* ===== 系別圖示 ===== */
        .type-icon {
            width: 22px;
            height: 22px;
            display: inline-block;
            margin: 0 1px;
            vertical-align: middle;
            border-radius: 4px;
        }

        /* 備用標籤樣式 */
        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
            margin: 0 2px;
            min-width: 20px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        /* ===== 表格 ===== */
        .table-wrap {
            overflow-x: auto;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        th {
            background: #edf2f7;
            color: #2d3748;
            padding: 12px 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .empty-row td {
            text-align: center;
            color: #a0aec0;
            padding: 30px 0;
            font-style: italic;
        }

        /* ===== 表格容器（可滾動） ===== */
        .table-scroll {
            max-height: 400px;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .table-scroll table {
            border-collapse: collapse;
            width: 100%;
        }
        .table-scroll thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .table-scroll thead th {
            background: #edf2f7;
            border-bottom: 2px solid #e2e8f0;
        }

        /* ===== 推薦卡片 ===== */
        .rec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .rec-card {
            background: #f7fafc;
            border-radius: 16px;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            transition: 0.2s;
        }
        .rec-card:hover {
            border-color: #6c5ce7;
            background: #faf9ff;
        }
        .rec-card .title {
            font-weight: 700;
            color: #2d3748;
            font-size: 1.1rem;
        }
        .rec-card .detail {
            font-size: 0.9rem;
            color: #4a5568;
            margin-top: 6px;
        }
        .rec-card .badge {
            display: inline-block;
            background: #6c5ce7;
            color: white;
            padding: 0 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 8px;
        }

        /* ===== 窩位擺放 ===== */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 8px;
        }
        .slot-pair {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #f7fafc;
            border-radius: 12px;
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            min-height: 100px;
            transition: 0.2s;
        }
        .slot-pair.has-recommendation {
            border-color: #6c5ce7;
            background: #faf9ff;
        }
        .slot-pair .slot-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #a0aec0;
            text-align: center;
            letter-spacing: 1px;
        }
        .slot-pair .slot-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 0.85rem;
            gap: 2px;
        }
        .slot-pair .slot-content .dad {
            color: #6c5ce7;
            font-weight: 700;
        }
        .slot-pair .slot-content .mom {
            color: #38a169;
            font-weight: 700;
        }
        .slot-pair .slot-content .arrow {
            color: #a0aec0;
            font-size: 1.2rem;
        }
        .slot-pair .slot-content .empty-text {
            color: #a0aec0;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .slot-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 480px) {
            .slot-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ===== RWD 響應式 ===== */
        @media (max-width: 640px) {
            body {
                padding: 4px;
            }
            .container { 
                padding: 16px 12px; 
                border-radius: 16px;
            }
            .flex-row { 
                flex-direction: column; 
                gap: 8px;
            }
            .form-group { 
                flex: 1 1 100%; 
                width: 100%;
            }
            .form-group input,
            .form-group select {
                width: 100%;
            }
            .form-group select#seasonFilter {
                width: 100%;
            }
            .btn { width: 100%; }
            /* 排除清單中的管理按鈕不撐滿 */
            #btnManageExclude {
                width: auto;
                flex-shrink: 0;
            }
            /* 願望清單中的管理按鈕不撐滿 */
            #btnManageWishlist {
                width: auto;
                flex-shrink: 0;
            }
            /* 彈窗中的清空按鈕不撐滿 */
            #btnExcludeClear,
            #btnWishlistClear {
                width: auto;
                flex-shrink: 0;
                padding: 6px 16px;
                font-size: 0.75rem;
            }
            /* 彈窗中的關閉和儲存按鈕也不撐滿 */
            #btnExcludeClose,
            #btnExcludeSave,
            #btnWishlistClose,
            #btnWishlistSave {
                width: auto;
                flex-shrink: 0;
                padding: 6px 16px;
                font-size: 0.75rem;
            }
            .rec-grid { grid-template-columns: 1fr; }
    
            /* 表格標題不換行 */
            .table-scroll th {
                white-space: nowrap;
                font-size: 0.8rem;
                padding: 8px 6px;
            }
            .table-scroll td {
                font-size: 0.8rem;
                padding: 6px 4px;
            }
            .table-scroll .btn-sm {
                padding: 4px 10px;
                font-size: 0.75rem;
            }
        }

    </style>
</head>
<body>

<div class="container">
    <h1>異色孵蛋智能配種</h1>

    <!-- ===== 輸入區域 ===== -->
    <div class="flex-row">
        <div class="form-group">
            <label>精靈名稱</label>
            <input type="text" id="inputName" placeholder="例如：雪影娃娃" list="nameSuggest">
            <datalist id="nameSuggest"></datalist>
        </div>
        <!-- ===== 賽季篩選 ===== -->
        <div class="form-group" style="flex: 0 0 auto; min-width: 120px;">
            <label>賽季篩選</label>
            <select id="seasonFilter">
                <option value="all">全部</option>
                <option value="S1常駐">S1常駐</option>
                <option value="S1賽季">S1賽季</option>
                <option value="S2常駐">S2常駐</option>
                <option value="S2賽季">S2賽季</option>
                <option value="S3常駐">S3常駐</option>
                <option value="S3賽季">S3賽季</option>
            </select>
        </div>
        <div class="form-group">
            <label>性別</label>
            <div style="display: flex; gap: 8px;">
                <button type="button" class="btn gender-btn active" data-gender="公" style="flex:1; padding: 10px; border-radius: 12px; background: #6c5ce7; color: white; border: 2px solid #6c5ce7;">♂ 公</button>
                <button type="button" class="btn gender-btn" data-gender="母" style="flex:1; padding: 10px; border-radius: 12px; background: white; color: #4a5568; border: 2px solid #e2e8f0;">♀ 母</button>
            </div>
            <input type="hidden" id="inputGender" value="公">
        </div>

        <div class="form-group" style="flex: 0 0 auto;">
            <button class="btn btn-primary" id="btnAdd">新增記錄</button>
        </div>
    </div>

    <!-- ===== 已記錄清單 ===== -->
    <h2>我的異色圖鑑（<span id="countDisplay">0</span>）</h2>
    <div class="table-scroll">
        <table id="recordTable">
            <thead>
                <tr>
                    <th>精靈</th>
                    <th>性別</th>
                    <th>系別</th>
                    <th>蛋組</th>
                    <th>賽季</th>
                    <th style="width:80px;">操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="5">還沒有記錄，快新增第一隻異色精靈吧！</td></tr>
            </tbody>
        </table>
    </div>

    <!-- ===== 智能推薦 ===== -->
    <h2>智能配種推薦</h2>

    <!-- ===== 排除清單（可選） ===== -->
    <div style="margin-top: -6px; margin-bottom: 8px; padding: 4px 0; background: transparent;">
        <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
            <span style="font-weight: 600; color: #4a5568; font-size: 0.85rem;">排除清單：</span>
            <div id="excludeTags" style="display: flex; flex-wrap: wrap; gap: 4px;"></div>
            <button class="btn btn-sm" id="btnManageExclude" style="padding: 2px 12px; font-size: 0.75rem;">管理</button>
        </div>
    </div>

    <!-- ===== 管理排除清單彈窗 ===== -->
    <div id="excludeModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; border-radius: 20px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: flex; flex-direction: column;">
            <h3 style="margin-top: 0;">管理排除清單</h3>
            <p style="font-size: 0.85rem; color: #718096; flex-shrink: 0;">勾選你暫時不想孵化的精靈</p>
            <div id="excludeChecklist" style="display: flex; flex-direction: column; gap: 4px; margin: 12px 0; flex: 1; overflow-y: auto;"></div>
            <div style="display: flex; gap: 8px; justify-content: space-between; flex-shrink: 0; padding-top: 12px; border-top: 1px solid #e2e8f0; background: white;">
                <button class="btn btn-sm" id="btnExcludeClear" style="background: #fc8181; color: white;">清空</button>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-sm" id="btnExcludeClose" style="background: #e2e8f0;">關閉</button>
                    <button class="btn btn-primary btn-sm" id="btnExcludeSave">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 願望清單（可選） ===== -->
    <div style="margin-top: 4px; margin-bottom: 8px; padding: 4px 0; background: transparent;">
        <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
            <span style="font-weight: 600; color: #4a5568; font-size: 0.85rem;">願望清單：</span>
            <div id="wishlistTags" style="display: flex; flex-wrap: wrap; gap: 4px;"></div>
            <button class="btn btn-sm" id="btnManageWishlist" style="padding: 2px 12px; font-size: 0.75rem;">管理</button>
        </div>
    </div>

    <!-- ===== 管理願望清單彈窗 ===== -->
    <div id="wishlistModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; border-radius: 20px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: flex; flex-direction: column;">
            <h3 style="margin-top: 0;">管理願望清單</h3>
            <p style="font-size: 0.85rem; color: #718096; flex-shrink: 0;">
                勾選你優先想孵化的精靈（將優先顯示在推薦中）
                <br><span style="color:#e53e3e; font-weight:600;">排除清單優先於願望清單！！！</span>（已排除的精靈無法加入願望清單）
            </p>
            <div id="wishlistChecklist" style="display: flex; flex-direction: column; gap: 4px; margin: 12px 0; flex: 1; overflow-y: auto;"></div>
            <div style="display: flex; gap: 8px; justify-content: space-between; flex-shrink: 0; padding-top: 12px; border-top: 1px solid #e2e8f0; background: white;">
                <button class="btn btn-sm" id="btnWishlistClear" style="background: #fc8181; color: white;">清空</button>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-sm" id="btnWishlistClose" style="background: #e2e8f0;">關閉</button>
                    <button class="btn btn-primary btn-sm" id="btnWishlistSave">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <div id="recommendationArea">
        <div class="rec-card" style="border-color:#d69e2e; background:#fffff0;">
            <div class="title">點擊下方按鈕重新整理推薦</div>
            <div class="detail">根據你已有的異色精靈，推薦可用的配種方案</div>
        </div>
    </div>
    <button class="btn btn-primary btn-sm" id="btnRefresh" style="margin-top:12px;">重新整理推薦</button>

    <div id="targetSelectionArea" style="margin-top: 20px; display: none;">
        <h2>選擇目標精靈</h2>
        <div id="targetGrid" class="rec-grid"></div>
        <button class="btn btn-primary btn-sm" id="btnCheckBreed" style="margin-top:12px;">🔍 檢查能否孵化</button>
        <div id="breedResult" style="margin-top:12px;"></div>
    </div>

    <!-- ===== 資料管理 ===== -->
    <div style="margin-top: 30px; border-top: 2px dashed #e2e8f0; padding-top: 20px; display: flex; gap: 12px; flex-wrap: wrap;">
        <button class="btn btn-sm" id="btnExport">📤 匯出資料</button>
        <button class="btn btn-sm" id="btnImport">📥 匯入資料</button>
        <input type="file" id="fileInput" accept=".json" style="display:none;">
        <button class="btn btn-sm btn-danger" id="btnClear">🗑️ 清空所有</button>
    </div>
</div>

    <!-- ===== 自訂確認對話框 ===== -->
    <div class="custom-confirm-overlay" id="customConfirm">
        <div class="custom-confirm-box">
            <p id="confirmMessage">確定要執行此操作嗎？</p>
            <div class="btn-group">
                <button class="btn btn-cancel" id="confirmCancel">取消</button>
                <button class="btn btn-confirm" id="confirmOk">確定</button>
            </div>
        </div>
    </div>

<script>


    // ---------- 通知父框架調整高度（用於 Google Sites 嵌入） ----------
    function notifyParent() {
        try {
            const height = document.documentElement.scrollHeight;
            // 嘗試發送訊息給父框架
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'resize',
                    height: height
                }, '*');
            }
        } catch(e) {}
    }

    // 頁面載入時和內容變更時通知
    window.addEventListener('load', function() {
        setTimeout(notifyParent, 300);
        // 監聽內容變更
        const observer = new MutationObserver(notifyParent);
        observer.observe(document.body, { childList: true, subtree: true, attributes: true });
    });

    // 視窗大小變更時也通知
    window.addEventListener('resize', notifyParent);

    // ================================================================
    // 1. 資料層
    // ================================================================

    // ---------- 精靈資料庫（名稱 -> 蛋組+賽季） ----------
    const ROCO_DB = {
        // ===== S1 賽季 =====
        "呼呼豬": { eggGroups: ["動物"], season: "S1常駐", types: ["冰", "地"] },
        "獠牙豬": { eggGroups: ["動物"], season: "S1常駐", evolvesFrom: "呼呼豬" },
        "治愈兔": { eggGroups: ["妖精", "動物"], season: "S1常駐", types: ["火", "萌"]  },
        "紅絲絨": { eggGroups: ["妖精", "動物"], season: "S1常駐", evolvesFrom: "治愈兔" },
        "紅絨十字": { eggGroups: ["妖精", "動物"], season: "S1常駐", evolvesFrom: "紅絲絨" },
        "大耳帽兜": { eggGroups: ["妖精", "擬人"], season: "S1常駐", genderLock: "母", types: ["冰", "萌"] },
        "帽兜娃娃": { eggGroups: ["妖精", "擬人"], season: "S1常駐", genderLock: "母", evolvesFrom: "大耳帽兜" },
        "雪影娃娃": { eggGroups: ["妖精", "擬人"], season: "S1常駐", genderLock: "母", evolvesFrom: "帽兜娃娃" },
        "機械方方": { eggGroups: ["擬人", "機械"], season: "S1常駐", types: ["機械"] },
        "多彩方方": { eggGroups: ["擬人", "機械"], season: "S1常駐", evolvesFrom: "機械方方" },
        "立方人": { eggGroups: ["擬人", "機械"], season: "S1常駐", evolvesFrom: "多彩方方" },
        "惡魔狼": { eggGroups: ["動物"], season: "S1常駐", types: ["惡"] },
        "拉特": { eggGroups: ["妖精"], season: "S1常駐", types: ["電"] },
        "酷拉": { eggGroups: ["妖精"], season: "S1常駐", evolvesFrom: "拉特" },
        "奇麗草": { eggGroups: ["植物"], season: "S1常駐", types: ["草"] },
        "奇麗葉": { eggGroups: ["植物"], season: "S1常駐", evolvesFrom: "奇麗草" },

    // ---------- 系別顏色（備用，當圖片載入失敗時） ----------
    const TYPE_COLORS = {
        "普通": "#3f89b4",
        "草": "#4ebc73",
        "火": "#db5525",
        "水": "#6aa9fe",
        "光": "#4fc0ff",

        "幻": "#9fa7f8",
    };

    // ---------- 精靈資料庫（名稱 -> 蛋組） ----------
    const SEASON_PRIORITY = {
        "S1": 1,
        "S2": 2,
        "S3": 3,
    };

    // ---------- 所有蛋組列表 ----------
    const ALL_EGG_GROUPS = ["妖精", "擬人", "天空", "兩棲", "大地", "軟體", "海洋", "巨靈", "魔力", "機械", "動物", "植物", "昆蟲"];

    // ---------- 儲存操作 ----------
    function loadRecords() {
        try {
            const data = localStorage.getItem('shinyRecords');
            return data ? JSON.parse(data) : [];
        } catch { return []; }
    }

    function saveRecords(records) {
        localStorage.setItem('shinyRecords', JSON.stringify(records));
    }

    // ---------- 輔助函式 ----------

    // ---------- 尋找進化鏈起點（初階精靈） ----------
    function findEvoBase(name) {
        const data = ROCO_DB[name];
        // 如果該精靈本身是基礎型態（沒有 evolvesFrom），返回自身
        if (data && !data.evolvesFrom) {
            return { name: name, data: data };
        }
        // 如果有 evolvesFrom，遞迴往上找
        if (data && data.evolvesFrom) {
            return findEvoBase(data.evolvesFrom);
        }
        return null;
    }

    // ---------- 取得進化鏈（從基礎型態到最終進化） ----------
    function getEvolutionChain(baseName) {
        const chain = [baseName];
        let current = baseName;
        // 查找 evolvesFrom 等於 current 的精靈（往上找進化型）
        let found = true;
        while (found) {
            found = false;
            for (const [name, data] of Object.entries(ROCO_DB)) {
                if (data.evolvesFrom === current && !chain.includes(name)) {
                    chain.push(name);
                    current = name;
                    found = true;
                    break;
                }
            }
        }
        return chain;
    }

    // ---------- 檢查是否為進化鏈中的基礎型態 ----------
    function isEvoBase(name) {
        const data = ROCO_DB[name];
        // 如果有 evolvesFrom 則不是基礎型態
        if (data && data.evolvesFrom) return false;
        // 沒有 evolvesFrom 就是基礎型態
        return true;
    }

    // ---------- 取得某精靈的基礎型態（如果是進化型） ----------
    function getEvoBaseName(name) {
        const base = findEvoBase(name);
        return base ? base.name : name;
    }

    // ---------- 渲染系別圖示 ----------
    function renderTypeIcons(types) {
        if (!types || types.length === 0) return '';
        
        return types.map(type => {
            const icon = TYPE_ICONS[type];
            const color = TYPE_COLORS[type] || '#999';
            
            if (icon) {
                // 使用 Base64 圖片
                return `<img src="${icon}" alt="${type}" class="type-icon" title="${type}" style="width:22px;height:22px;display:inline-block;margin:0 1px;vertical-align:middle;">`;
            } else {
                // 備用：使用彩色標籤
                return `<span class="type-badge" style="background:${color};">${type}</span>`;
            }
        }).join('');
    }

    // 取得某個蛋組下所有已知精靈名稱
    function getRocosByEggGroup(group) {
        const result = [];
        for (const [name, data] of Object.entries(ROCO_DB)) {
            if (data.eggGroups.includes(group)) {
                result.push({ name, season: data.season });
            }
        }
        // 依賽季排序（早賽季優先）
        result.sort((a, b) => (SEASON_PRIORITY[a.season] || 999) - (SEASON_PRIORITY[b.season] || 999));
        return result;
    }

    // 取得所有已記錄的精靈名稱（去重）
    function getRecordedNames(records) {
        const set = new Set();
        records.forEach(r => set.add(r.name));
        return set;
    }

    // 取得所有已記錄的蛋組（去重）
    function getRecordedGroups(records) {
        const set = new Set();
        records.forEach(r => {
            if (Array.isArray(r.eggGroups)) {
                r.eggGroups.forEach(g => set.add(g));
            } else {
                set.add(r.eggGroup); // 向後相容舊資料
            }
        });
        return set;
    }

    // 取得某隻精靈的所有蛋組
    function getEggGroupsForRoco(name) {
        const data = ROCO_DB[name];
        return data ? data.eggGroups : [];
    }

    // 取得某隻精靈的賽季
    function getSeasonForRoco(name) {
        const data = ROCO_DB[name];
        return data ? data.season : null;
    }

    // 取得目前擁有的異色公精靈列表（用於配種推薦）
    function getMaleShinies(records) {
        return records.filter(r => r.gender === '公');
    }

    // ================================================================
    // 2. 渲染層
    // ================================================================

    let records = loadRecords();

    // ---------- 排除清單 ----------
    let excludeList = JSON.parse(localStorage.getItem('excludeList') || '[]');

    function saveExcludeList() {
        localStorage.setItem('excludeList', JSON.stringify(excludeList));
        renderExcludeTags();
        renderRecommendations(); // 重新整理推薦
    }

    function renderExcludeTags() {
        const container = document.getElementById('excludeTags');
        if (excludeList.length === 0) {
            container.innerHTML = '<span style="font-size:0.85rem; color:#a0aec0;">無</span>';
            return;
        }
        container.innerHTML = excludeList.map(name => 
            `<span style="background:#fed7d7; color:#c53030; padding:2px 10px; border-radius:12px; font-size:0.8rem;">${name}</span>`
        ).join('');
    }

    function renderExcludeChecklist() {
        const container = document.getElementById('excludeChecklist');
        const allRocos = Object.keys(ROCO_DB);
        
        // 只顯示基礎型態（沒有 evolvesFrom 的精靈）
        const baseForms = allRocos.filter(name => isEvoBase(name));
        
        // 只顯示尚未擁有的基礎型態
        const recordedNames = getRecordedNames(records);
        const missing = baseForms.filter(name => !recordedNames.has(name));
        
        if (missing.length === 0) {
            container.innerHTML = '<div style="color:#a0aec0; text-align:center; padding:20px 0;">🎉 已收集所有基礎型態的異色精靈！</div>';
            return;
        }
        
        container.innerHTML = missing.map(name => {
            const checked = excludeList.includes(name) ? 'checked' : '';

        // 顯示提醒：排除優先

            ⚠️ 排除清單優先於願望清單（已排除的精靈會自動從願望清單移除）
        </div>`;

            const evoChain = getEvolutionChain(name);
            const evoDisplay = evoChain.length > 1 ? ` → ${evoChain.slice(1).join(' → ')}` : '';
            const isExcluded = excludeList.includes(name);
            return `
                <label style="display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; border-bottom: 1px solid #f0f0f0; ${isExcluded ? 'opacity:0.5;' : ''}">
                    <input type="checkbox" class="wishlist-checkbox" value="${name}" ${checked} ${isExcluded ? 'disabled' : ''}>
                    <span style="font-weight: 500;">${name}</span>
                    <span style="font-size:0.75rem; color:#a0aec0;">（${eggDisplay}·${data.season}${evoDisplay}）</span>

    document.getElementById('btnWishlistClear').addEventListener('click', function() {

    document.getElementById('wishlistModal').addEventListener('click', function(e) {
        if (e.target === this) {

        }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const countSpan = document.getElementById('countDisplay');
        countSpan.textContent = records.length;

        if (records.length === 0) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="5">還沒有記錄，快新增第一隻異色精靈吧！</td></tr>`;
            return;
        }

        let html = '';
        records.forEach((r, index) => {
            const typesHtml = renderTypeIcons(r.types);
            const eggDisplay = Array.isArray(r.eggGroups) ? r.eggGroups.join('、') : r.eggGroup;
            const seasonDisplay = r.season || '未知';
            
            html += `
                <tr>
                    <td><strong>${r.name}</strong></td>
                    <td>${r.gender === '公' ? '♂ 公' : '♀ 母'}</td>
                    <td>${typesHtml}</td>
                    <td>${eggDisplay}</td>
                    <td>${seasonDisplay}</td>
                    <td><button class="btn btn-danger btn-sm" data-index="${index}">刪除</button></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;

        // 綁定刪除事件
        tbody.querySelectorAll('[data-index]').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                records.splice(idx, 1);
                saveRecords(records);
                renderTable();
                renderRecommendations();
            });
        });
    }

    // ---------- 推薦引擎（重構版） ----------
    function renderRecommendations() {
        const area = document.getElementById('recommendationArea');
        const targetArea = document.getElementById('targetSelectionArea');
        
        if (records.length === 0) {
            area.innerHTML = `
                <div class="rec-card" style="border-color:#d69e2e; background:#fffff0;">
                    <div class="title">暫無記錄</div>
                    <div class="detail">先新增一些異色精靈，推薦才會出現</div>
                </div>
            `;
            targetArea.style.display = 'none';
            return;
        }

        const recordedGroups = getRecordedGroups(records);
        const recordedNames = getRecordedNames(records);
        const maleShinies = getMaleShinies(records);
        const femaleShinies = records.filter(r => r.gender === '母');

        let html = '<div class="rec-grid">';

        // ----- 推薦1：目前圖鑑（保留） -----
        const allRocos = Object.keys(ROCO_DB);
        
        // 分組：基礎型態 vs 進化型
        const baseForms = [];
        const evoForms = [];
        for (const name of allRocos) {
            if (isEvoBase(name)) {
                baseForms.push(name);
            } else {
                evoForms.push(name);
            }
        }
        
        // 總基礎型態數量
        const totalBaseCount = baseForms.length;
        
        // 計算真正缺少的精靈（基礎型態中沒有的 + 進化型中沒有對應基礎型態的）
        const missingBase = baseForms.filter(name => !recordedNames.has(name));
        // 進化型中，如果對應的基礎型態已擁有，則不算缺少
        const missingEvo = evoForms.filter(name => {
            const baseName = getEvoBaseName(name);
            return !recordedNames.has(baseName);
        });
        // 合併缺少清單（只顯示基礎型態名稱）
        const missingDisplay = [...missingBase];
        // 對於進化型缺少但基礎型態也缺少的，不重複顯示
        for (const evoName of missingEvo) {
            const baseName = getEvoBaseName(evoName);
            if (!missingDisplay.includes(baseName) && !recordedNames.has(baseName)) {
                missingDisplay.push(baseName);
            }
        }

        // 計算已收集種類（以基礎型態為單位）
        // 如果玩家擁有基礎型態或其任何進化型的記錄，就算已收集
        let ownedSpecies = 0;
        for (const baseName of baseForms) {
            // 檢查玩家是否有該基礎型態的記錄
            if (recordedNames.has(baseName)) {
                ownedSpecies++;
                continue;
            }
            // 檢查玩家是否有該基礎型態的進化型記錄
            const evoChain = getEvolutionChain(baseName);
            for (const evoName of evoChain) {
                if (recordedNames.has(evoName) && evoName !== baseName) {
                    ownedSpecies++;
                    break;
                }
            }
        }

        html += `
            <div class="rec-card" style="border-color:#6c5ce7; background:#faf9ff; grid-column: 1 / -1;">
                <div class="title">📊 目前圖鑑</div>
                <div class="detail">
                    <div>異色總數：<strong>${records.length}</strong> 隻</div>
                    <div>已收集種類：<strong>${ownedSpecies}/${totalBaseCount}</strong>（不包括通行證精靈）</div>
                    <div>覆蓋蛋組：${recordedGroups.size ? Array.from(recordedGroups).join('、') : '無'}</div>
                    <div>可作父本（公）：${maleShinies.length} 隻</div>
                    <div>可作母本（母）：${femaleShinies.length} 隻</div>
                    ${missingDisplay.length > 0 ? `<div>尚未擁有：${missingDisplay.join('、')}</div>` : ''}
                </div>
            </div>
        `;

        // 更新 missingSpecies（用於後續推薦）
        const missingSpecies = missingDisplay;

        // ===== 判斷是否集齊所有精靈（以基礎型態為單位） =====
        const isComplete = missingSpecies.length === 0;

        // ----- 推薦2：窩位擺放建議（10個slot，兩兩一組） -----
        if (!isComplete && maleShinies.length > 0) {
            // 過濾排除清單（使用者不想孵化的精靈）
            const filteredMissing = missingSpecies.filter(name => !excludeList.includes(name));
            
            // 先分組：願望清單優先，同時直接孵化優先於兩步孵化
            const wishlistDirect = [];     // 願望清單 + 可直接孵化
            const wishlistIndirect = [];   // 願望清單 + 需要兩步孵化
            const nonWishlistDirect = [];  // 非願望清單 + 可直接孵化
            const nonWishlistIndirect = [];// 非願望清單 + 需要兩步孵化
            
            for (const name of filteredMissing) {
                const targetData = ROCO_DB[name];
                if (!targetData) continue;
                
                // 檢查是否可直接孵化
                let canDirect = false;
                for (const group of targetData.eggGroups) {
                    const dads = maleShinies.filter((m, idx) => {
                        const mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                        return mGroups.includes(group);
                    });
                    if (dads.length > 0) {
                        canDirect = true;
                        break;
                    }
                }
                
                const inWishlist = wishlist.includes(name);
                
                if (inWishlist && canDirect) {
                    wishlistDirect.push(name);
                } else if (inWishlist && !canDirect) {
                    wishlistIndirect.push(name);
                } else if (!inWishlist && canDirect) {
                    nonWishlistDirect.push(name);
                } else {
                    nonWishlistIndirect.push(name);
                }
            }
            
            // 合併：願望清單(直接) → 願望清單(兩步) → 非願望清單(直接) → 非願望清單(兩步)
            const sortedMissing = [...wishlistDirect, ...wishlistIndirect, ...nonWishlistDirect, ...nonWishlistIndirect];
            
            if (sortedMissing.length === 0) {
                // 所有未擁有的精靈都被排除了
                html += `
                    <div class="rec-card" style="border-color:#d69e2e; background:#fffbeb; grid-column: 1 / -1;">
                        <div class="title">暫無推薦</div>
                        <div class="detail">
                            所有尚未擁有的精靈都已加入排除清單。<br>
                            點擊「管理」取消排除，或新增更多異色精靈。
                        </div>
                    </div>
                `;
            } else {
                // 建立推薦組合清單（目標精靈 -> 可用父本）
                const usedDadIndices = new Set();
                const recommendations = [];
                
                // 先處理可以直接配對的 sortedMissing
                let remainingMissing = [];
                
                for (const missingName of sortedMissing) {
                    const targetData = ROCO_DB[missingName];
                    if (!targetData) continue;
                    
                    let availableDad = null;
                    let availableDadIndex = -1;
                    let usedGroup = null;
                    
                    for (const group of targetData.eggGroups) {
                        const dads = maleShinies.filter((m, idx) => {
                            const mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                            return mGroups.includes(group) && !usedDadIndices.has(idx);
                        });
                        if (dads.length > 0) {
                            availableDad = dads[0];
                            availableDadIndex = maleShinies.indexOf(availableDad);
                            usedGroup = group;
                            break;
                        }
                    }
                    
                    if (availableDad) {
                        usedDadIndices.add(availableDadIndex);
                        recommendations.push({
                            target: missingName,
                            season: targetData.season,
                            dad: availableDad.name,
                            dadSeason: availableDad.season,
                            group: usedGroup,
                            isDirect: true,
                            _sortOrder: sortedMissing.indexOf(missingName)
                        });
                    } else {
                        remainingMissing.push({ name: missingName, data: targetData });
                    }
                }

                // ===== 處理無法直接配對的目標（兩步孵化推薦） =====
                for (const { name: missingName, data: targetData } of remainingMissing) {
                    for (const group of targetData.eggGroups) {
                        const allInGroup = getRocosByEggGroup(group);
                        
                        const availableAltTargets = allInGroup.filter(item => {
                            if (item.name === missingName) return false;
                            if (excludeList.includes(item.name)) return false;
                            const hasFemale = records.some(r => r.name === item.name && r.gender === '母');
                            if (!hasFemale) return false;
                            const hasShinyMale = records.some(r => r.name === item.name && r.gender === '公');
                            return !hasShinyMale;
                        });
                        
                        for (const altTarget of availableAltTargets) {
                            const altData = ROCO_DB[altTarget.name];
                            if (!altData) continue;
                            
                            let availableDad = null;
                            let availableDadIndex = -1;
                            let usedGroup = null;
                            
                            for (const altGroup of altData.eggGroups) {
                                const dads = maleShinies.filter((m, idx) => {
                                    const mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                                    return mGroups.includes(altGroup) && !usedDadIndices.has(idx);
                                });
                                if (dads.length > 0) {
                                    availableDad = dads[0];
                                    availableDadIndex = maleShinies.indexOf(availableDad);
                                    usedGroup = altGroup;
                                    break;
                                }
                            }
                            
                            if (availableDad) {
                                usedDadIndices.add(availableDadIndex);
                                recommendations.push({
                                    target: missingName,
                                    altTarget: altTarget.name,
                                    season: altData.season,
                                    dad: availableDad.name,
                                    dadSeason: availableDad.season,
                                    group: usedGroup,
                                    targetGroup: group,
                                    isDirect: false,
                                    hasFemale: true,
                                    _sortOrder: sortedMissing.indexOf(missingName)
                                });
                                break;
                            }
                        }
                    }
                }

                // ===== 按照 sortedMissing 的順序排序 =====
                recommendations.sort((a, b) => a._sortOrder - b._sortOrder);

                if (recommendations.length === 0) {
                    html += `
                        <div class="rec-card" style="border-color:#e53e3e; background:#fff5f5; grid-column: 1 / -1;">
                            <div class="title">缺少異色公精靈</div>
                            <div class="detail">
                                配種需要 <strong>異色父本</strong> 才能高效出異色子代。<br>
                                建議優先捕捉或孵出一隻異色公精靈。
                            </div>
                        </div>
                    `;
                } else {
                    let slotHtml = '<div class="slot-grid">';
                    const totalSlots = 10;
                    
                    for (let i = 0; i < totalSlots; i++) {
                        const pairIndex = Math.floor(i / 2);
                        const rec = recommendations[pairIndex] || null;
                        const isFirst = i % 2 === 0;
                        
                        if (rec) {
                            if (isFirst) {
                                if (rec.isDirect) {
                                    slotHtml += `
                                        <div class="slot-pair has-recommendation">
                                            <div class="slot-label">⬅ 窩位 ${pairIndex + 1}</div>
                                            <div class="slot-content">
                                                <span class="dad">♂ ${rec.dad}</span>
                                                <span style="font-size:0.65rem; color:#a0aec0;">
                                                    ${rec.dadSeason} · ${rec.group}
                                                    <br>直接孵化 <strong style="color:#d69e2e;">${rec.target}（異色）</strong>
                                                </span>
                                            </div>
                                        </div>
                                    `;
                                } else {
                                    slotHtml += `
                                        <div class="slot-pair has-recommendation" style="border-color:#38a169; background:#f0fff4;">
                                            <div class="slot-label">⬅ 窩位 ${pairIndex + 1}</div>
                                            <div class="slot-content">
                                                <span class="dad">♂ ${rec.dad}</span>
                                                <span style="font-size:0.65rem; color:#a0aec0;">
                                                    ${rec.dadSeason} · ${rec.group}
                                                    <br>孵化 <strong style="color:#6c5ce7;">♂ ${rec.altTarget}（異色）</strong>
                                                    <br>用以孵化 <strong style="color:#d69e2e;">${rec.target}（異色）</strong>
                                                </span>
                                            </div>
                                        </div>
                                    `;
                                }
                            } else {
                                if (rec.isDirect) {
                                    slotHtml += `
                                        <div class="slot-pair has-recommendation">
                                            <div class="slot-label">窩位 ${pairIndex + 1} ➡</div>
                                            <div class="slot-content">
                                                <span class="mom">${rec.target} ♀</span>
                                                <span style="font-size:0.65rem; color:#a0aec0;">
                                                    ${rec.season} · ${rec.group}
                                                    <br>直接孵化 <strong style="color:#d69e2e;">${rec.target}（異色）</strong>
                                                </span>
                                            </div>
                                        </div>
                                    `;
                                } else {
                                    slotHtml += `
                                        <div class="slot-pair has-recommendation" style="border-color:#38a169; background:#f0fff4;">
                                            <div class="slot-label">窩位 ${pairIndex + 1} ➡</div>
                                            <div class="slot-content">
                                                <span class="mom">${rec.altTarget} ♀</span>
                                                <span style="font-size:0.65rem; color:#a0aec0;">
                                                    ${rec.season} · ${rec.targetGroup}
                                                    <br>孵化 <strong style="color:#6c5ce7;">♂ ${rec.altTarget}（異色）</strong>
                                                    <br>用以孵化 <strong style="color:#d69e2e;">${rec.target}（異色）</strong>
                                                </span>
                                            </div>
                                        </div>
                                    `;
                                }
                            }
                        } else {
                            slotHtml += `
                                <div class="slot-pair">
                                    <div class="slot-label">${isFirst ? '⬅ 窩位 ' + (pairIndex + 1) : '窩位 ' + (pairIndex + 1) + ' ➡'}</div>
                                    <div class="slot-content">
                                        <span class="empty-text">空位</span>
                                    </div>
                                </div>
                            `;
                        }
                    }
                    slotHtml += '</div>';

                    html += `
                        <div class="rec-card" style="border-color:#d69e2e; background:#fffbeb; grid-column: 1 / -1;">
                            <div class="title">窩位擺放建議（10個窩位）</div>
                            <div class="detail">
                                <div style="font-size:0.85rem; margin-bottom:8px; color:#718096;">
                                    <span style="color:#6c5ce7;">紫色背景</span> = 直接孵化異色精靈 &nbsp;|&nbsp;
                                    <span style="color:#38a169;">綠色背景</span> = 先孵化替代異色以配目標
                                </div>
                                ${slotHtml}
                                <div style="font-size:0.8rem; color:#718096; margin-top:8px;">
                                    依賽季排序，早賽季優先推薦
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        // ----- 推薦3：集齊時顯示目標選擇（可勾選） -----
        if (isComplete) {
            // 顯示目標選擇區塊
            targetArea.style.display = 'block';
            renderTargetGrid();
        } else {
            targetArea.style.display = 'none';
        }

        html += '</div>';
        area.innerHTML = html;

        // 更新 datalist 自動補全
        updateDatalist();
    }

    // ---------- 渲染目標精靈網格（勾選用） ----------
    function renderTargetGrid() {
        const grid = document.getElementById('targetGrid');
        const allRocos = Object.keys(ROCO_DB);
        const recordedNames = getRecordedNames(records);

        let html = '';
        for (const name of allRocos) {
            const data = ROCO_DB[name];
            const hasShiny = recordedNames.has(name);
            const eggDisplay = data.eggGroups.join('、');
            html += `
                <div class="rec-card" style="cursor: pointer; ${hasShiny ? 'border-color:#6c5ce7; background:#faf9ff;' : 'opacity:0.6;'}"
                     onclick="toggleTarget('${name}')">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="target_${name}" ${hasShiny ? '' : 'disabled'}>
                        <label for="target_${name}" style="font-weight: 700; cursor: pointer;">${name}</label>
                    </div>
                    <div class="detail">
                        蛋組：${eggDisplay}<br>
                        賽季：${data.season}
                        ${hasShiny ? '<span style="color:#38a169;"> ✅ 已有異色</span>' : '<span style="color:#e53e3e;"> ⚠️ 尚未擁有</span>'}
                    </div>
                </div>
            `;
        }
        grid.innerHTML = html;
    }

    // ---------- 切換目標精靈選取 ----------
    let selectedTargets = new Set();

    function toggleTarget(name) {
        const data = ROCO_DB[name];
        if (!data) return;
        const recordedNames = getRecordedNames(records);
        if (!recordedNames.has(name)) return; // 未擁有異色不可選
        
        if (selectedTargets.has(name)) {
            selectedTargets.delete(name);
        } else {
            selectedTargets.add(name);
        }
        
        // 更新 UI 樣式
        const card = document.querySelector(`[onclick="toggleTarget('${name}')"]`);
        if (card) {
            if (selectedTargets.has(name)) {
                card.style.borderColor = '#d69e2e';
                card.style.background = '#fffbeb';
            } else {
                card.style.borderColor = '#6c5ce7';
                card.style.background = '#faf9ff';
            }
        }
    }

    // ---------- 檢查能否孵化（雙異色配種） ----------
    document.getElementById('btnCheckBreed').addEventListener('click', function() {
        const resultDiv = document.getElementById('breedResult');
        
        if (selectedTargets.size === 0) {
            resultDiv.innerHTML = `<div style="color:#e53e3e;">請至少選擇一隻目標精靈</div>`;
            return;
        }
        
        // 取得所有異色公與母
        const maleShinies = records.filter(r => r.gender === '公');
        const femaleShinies = records.filter(r => r.gender === '母');
        
        let resultHtml = '<div style="margin-top:8px;">';
        let hasAnyBreedable = false;
        
        for (const targetName of selectedTargets) {
            const targetData = ROCO_DB[targetName];
            if (!targetData) continue;
            
            // 檢查該精靈的所有蛋組
            let canBreed = false;
            let breedDetails = [];
            
            for (const group of targetData.eggGroups) {
                // 找同蛋組的異色公
                const availableMales = maleShinies.filter(m => {
                    const mGroups = Array.isArray(m.eggGroups) ? m.eggGroups : [m.eggGroup];
                    return mGroups.includes(group);
                });
                // 找同蛋組的異色母
                const availableFemales = femaleShinies.filter(f => {
                    const fGroups = Array.isArray(f.eggGroups) ? f.eggGroups : [f.eggGroup];
                    return fGroups.includes(group);
                });
                
                if (availableMales.length > 0 && availableFemales.length > 0) {
                    canBreed = true;
                    hasAnyBreedable = true;
                    breedDetails.push({
                        group,
                        males: availableMales.map(m => m.name).join('、'),
                        females: availableFemales.map(f => f.name).join('、')
                    });
                }
            }
            
            if (canBreed) {
                resultHtml += `
                    <div style="padding: 8px 12px; margin: 4px 0; background: #f0fff4; border-left: 4px solid #38a169; border-radius: 4px;">
                        ✅ <strong>${targetName}</strong> 可以孵化！
                        ${breedDetails.map(d => `
                            <br>&nbsp;&nbsp;└ 蛋組【${d.group}】：${d.males}（♂） × ${d.females}（♀）
                        `).join('')}
                    </div>
                `;
            } else {
                resultHtml += `
                    <div style="padding: 8px 12px; margin: 4px 0; background: #fff5f5; border-left: 4px solid #e53e3e; border-radius: 4px;">
                        ❌ <strong>${targetName}</strong> 目前無法孵化（缺少同蛋組的異色公或異色母）
                        <br>&nbsp;&nbsp;└ 需要蛋組：${targetData.eggGroups.join('、')}
                    </div>
                `;
            }
        }
        
        if (!hasAnyBreedable) {
            resultHtml += `<div style="color:#e53e3e; margin-top:8px;">⚠️ 所選目標目前皆無法孵化，請先收集更多異色精靈</div>`;
        }
        
        resultHtml += '</div>';
        resultDiv.innerHTML = resultHtml;
    });

    // ---------- 更新輸入框自動補全（支援賽季篩選 + 進化型） ----------
    function updateDatalist() {
        const datalist = document.getElementById('nameSuggest');
        const seasonFilter = document.getElementById('seasonFilter').value;
        
        // 取得 ROCO_DB 中所有名稱（按照定義順序）
        let names = Object.keys(ROCO_DB);
        
        // 如果有選擇賽季，進行過濾
        if (seasonFilter !== 'all') {
            names = names.filter(name => {
                const data = ROCO_DB[name];
                return data.season === seasonFilter;
            });
        }
        
        // 建立結果陣列，並記錄已加入的名稱（避免重複）
        const result = [];
        const added = new Set();
        
        for (const name of names) {
            // 如果已經加入過，跳過
            if (added.has(name)) continue;
            
            result.push(name);
            added.add(name);
            
            // 檢查是否有進化型（evolvesFrom 指向當前精靈）
            for (const [evoName, evoData] of Object.entries(ROCO_DB)) {
                if (evoData.evolvesFrom === name && !added.has(evoName)) {
                    // 檢查該進化型是否在當前賽季過濾範圍內
                    if (seasonFilter === 'all' || evoData.season === seasonFilter) {
                        result.push(evoName);
                        added.add(evoName);
                    }
                }
            }
        }
        
        datalist.innerHTML = result.map(n => `<option value="${n}">`).join('');
    }

    // 自訂確認對話框
    let confirmCallback = null;

    function showConfirm(message, callback) {
        document.getElementById('confirmMessage').textContent = message;
        document.getElementById('customConfirm').style.display = 'flex';
        confirmCallback = callback;
    }

    document.getElementById('confirmCancel').addEventListener('click', function() {
        document.getElementById('customConfirm').style.display = 'none';
        if (confirmCallback) confirmCallback(false);
        confirmCallback = null;
    });

    document.getElementById('confirmOk').addEventListener('click', function() {
        document.getElementById('customConfirm').style.display = 'none';
        if (confirmCallback) confirmCallback(true);
        confirmCallback = null;
    });

    // 點擊背景關閉
    document.getElementById('customConfirm').addEventListener('click', function(e) {
        if (e.target === this) {
            this.style.display = 'none';
            if (confirmCallback) confirmCallback(false);
            confirmCallback = null;
        }
    });

    // ================================================================
    // 3. 事件綁定
    // ================================================================

    // ---------- 性別自動限制（根據精靈） ----------
    document.getElementById('inputName').addEventListener('input', function() {
        const name = this.value.trim();
        const rocoData = ROCO_DB[name];
        const genderBtns = document.querySelectorAll('.gender-btn');
        const hiddenInput = document.getElementById('inputGender');
        
        // 重置所有按鈕為可用
        genderBtns.forEach(btn => {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
        });
        
        if (rocoData && rocoData.genderLock) {
            // 如果有性別限制，禁用另一個性別按鈕
            genderBtns.forEach(btn => {
                if (btn.dataset.gender !== rocoData.genderLock) {
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                } else {
                    // 自動選取可用性別
                    hiddenInput.value = rocoData.genderLock;
                    // 更新按鈕樣式
                    genderBtns.forEach(b => {
                        b.classList.remove('active');
                        b.style.background = 'white';
                        b.style.color = '#4a5568';
                        b.style.borderColor = '#e2e8f0';
                    });
                    btn.classList.add('active');
                    btn.style.background = '#6c5ce7';
                    btn.style.color = 'white';
                    btn.style.borderColor = '#6c5ce7';
                }
            });
        }
    });

    // ---------- 性別按鈕切換 ----------
    document.querySelectorAll('.gender-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const gender = this.dataset.gender;
            const hiddenInput = document.getElementById('inputGender');
            
            // 檢查是否被禁用（由性別限制功能控制）
            if (this.style.opacity === '0.5' || this.disabled) return;
            
            // 更新 hidden input 的值
            hiddenInput.value = gender;
            
            // 更新按鈕樣式
            document.querySelectorAll('.gender-btn').forEach(b => {
                b.classList.remove('active');
                b.style.background = 'white';
                b.style.color = '#4a5568';
                b.style.borderColor = '#e2e8f0';
            });
            this.classList.add('active');
            this.style.background = '#6c5ce7';
            this.style.color = 'white';
            this.style.borderColor = '#6c5ce7';
        });
    });

    // ---------- 新增記錄 ----------
    document.getElementById('btnAdd').addEventListener('click', function() {
        const nameInput = document.getElementById('inputName');
        const gender = document.getElementById('inputGender').value;

        let inputName = nameInput.value.trim();
        if (!inputName) {
            alert('請輸入精靈名稱');
            return;
        }

        // 1. 先檢查是否直接存在
        let rocoData = ROCO_DB[inputName];
        let actualName = inputName;
        
        // 2. 如果不存在，或該精靈是進化型（有 evolvesFrom），尋找進化鏈起點
        if (!rocoData || (rocoData && rocoData.evolvesFrom)) {
            const base = findEvoBase(inputName);
            if (base && base.name) {
                actualName = base.name;
                rocoData = base.data;
            }
        }
        
        if (!rocoData) {
            alert(`「${inputName}」不在資料庫中，且找不到對應的初階形態`);
            return;
        }

        // 儲存時記錄初階精靈名稱
        records.push({
            name: actualName,              // 存初階精靈
            gender,
            eggGroups: rocoData.eggGroups,
            season: rocoData.season,
            eggGroup: rocoData.eggGroups[0],
            types: rocoData.types || [],
            searchedName: inputName !== actualName ? inputName : undefined
        });
        saveRecords(records);
        renderTable();
        renderRecommendations();
        nameInput.value = '';
        nameInput.focus();
    });

    // 按下 Enter 快速新增
    document.getElementById('inputName').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('btnAdd').click();
    });

    // ---------- 重新整理推薦 ----------
    document.getElementById('btnRefresh').addEventListener('click', renderRecommendations);

    // ---------- 賽季篩選變更時更新自動補全 ----------
    document.getElementById('seasonFilter').addEventListener('change', function() {
        updateDatalist();
    });

    // ---------- 匯出資料 ----------
    document.getElementById('btnExport').addEventListener('click', function() {
        const exportData = {
            records: records,
            excludeList: excludeList,
            wishlist: wishlist,  // ← 新增
            version: "1.0",
            exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `異色精靈記錄_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    });

    // ---------- 匯入資料 ----------
    document.getElementById('btnImport').addEventListener('click', function() {
        document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                
                // 判斷是新版格式（包含 excludeList）還是舊版格式（只有 records）
                let importedRecords = [];
                let importedExcludeList = [];
                let importedWishlist = [];

                if (data.records && Array.isArray(data.records)) {
                    // 新版格式
                    importedRecords = data.records;
                    importedExcludeList = data.excludeList || [];
                    importedWishlist = data.wishlist || [];
                } else if (Array.isArray(data)) {
                    // 舊版格式（只有 records 陣列）
                    importedRecords = data;
                } else {
                    alert('資料格式錯誤，請匯入正確的 JSON 檔案');
                    return;
                }
                
                // ===== 轉換舊資料格式 =====
                const convertedRecords = importedRecords.map(r => {
                    // 1. 賽季格式轉換（舊版 -> 新版）
                    if (r.season && !r.season.includes('常駐') && !r.season.includes('賽季')) {
                        const rocoData = ROCO_DB[r.name];
                        if (rocoData && rocoData.season) {
                            r.season = rocoData.season;
                        } else {
                            r.season = r.season + '常駐';
                        }
                    }
                    
                    // 2. 補上系別（types）
                    if (!r.types || r.types.length === 0) {
                        const rocoData = ROCO_DB[r.name];
                        if (rocoData && rocoData.types) {
                            r.types = rocoData.types;
                        } else {
                            r.types = [];
                        }
                    }
                    
                    return r;
                });
                
                records = convertedRecords;
                excludeList = importedExcludeList;
                wishlist = importedWishlist;

                saveRecords(records);
                saveExcludeList();
                saveWishlist();
                renderTable();
                renderRecommendations();
                renderExcludeTags();
                
                alert(`匯入成功！已匯入 ${records.length} 筆記錄，排除清單 ${excludeList.length} 項。`);
            } catch {
                alert('檔案解析失敗');
            }
        };
        reader.readAsText(file);
        this.value = '';
    });

    // ---------- 清空資料 ----------
    document.getElementById('btnClear').addEventListener('click', function() {
        showConfirm('確定要清空所有記錄嗎？\n此操作無法復原！', function(confirmed) {
            if (confirmed) {
                records = [];
                excludeList = [];
                wishlist = [];
                saveRecords(records);
                saveExcludeList();
                saveWishlist();
                renderTable();
                renderRecommendations();
                renderExcludeTags();
                renderWishlistTags();
            }
        });
    });

    // ================================================================
    // 4. 初始化
    // ================================================================

    // 如果資料庫中已有精靈但蛋組缺失，嘗試補上
    records = records.map(r => {
        if (ROCO_DB[r.name] && (!r.eggGroup || r.eggGroup === '未分類')) {
            r.eggGroup = ROCO_DB[r.name];
        }
        return r;
    });
    saveRecords(records);

    renderTable();
    renderRecommendations();
    updateDatalist();
    renderExcludeTags();
    renderWishlistTags();

    console.log('✨ 異色精靈記錄器已啟動！資料保存在瀏覽器本地。');
    console.log('📦 目前記錄數:', records.length);
</script>

</body>
</html>
